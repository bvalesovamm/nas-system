// Lokální ISO datum (YYYY-MM-DD) BEZ převodu na UTC — jinak v UTC+2 padá „dnešek" o den zpět
function isoLocal(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
// Číslo s českou desetinnou čárkou i tečkou (např. „129,7" → 129.7); prázdné → null
function numCZ(v) { if (v == null || String(v).trim() === "") return null; const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isNaN(n) ? null : n; }

function parseDateIso(s) {
  if (!s) return null;
  // Try ISO date YYYY-MM-DD
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s + "T00:00:00");
  return null;
}

function daysBetween(a, b) {
  return Math.round((b - a) / (1000*60*60*24));
}

function dashStats() {
  const today = new Date(); today.setHours(0,0,0,0);
  const tasks = DB.tasks || [];
  
  // Tasks by priority (open only)
  const openTasks = tasks.filter(t => !t.done);
  const tasksHigh = openTasks.filter(t => t.priority === "Vysoká").length;
  const tasksMid = openTasks.filter(t => t.priority === "Střední").length;
  const tasksLow = openTasks.filter(t => t.priority === "Nízká").length;
  const tasksPlanned = openTasks.filter(t => t.priority === "Plánováno").length;
  const tasksRoutine = openTasks.filter(t => t.priority === "Stálé").length;
  
  // Appointments
  const appts = DB.appointments || [];
  const toBook = appts.filter(a => (a.budouciText && a.budouciText.toUpperCase().includes("OBJEDNAT"))).length;
  
  const in30days = appts.filter(a => {
    const d = parseDateIso(a.budouciDate);
    if (!d) return false;
    const days = daysBetween(today, d);
    return days >= 0 && days <= 30;
  }).length;
  
  const overdue = appts.filter(a => {
    const d = parseDateIso(a.budouciDate);
    if (!d) return false;
    return d < today;
  }).length;
  
  const callsIn14 = appts.filter(a => {
    const d = parseDateIso(a.terminVolaniDate);
    if (!d) return false;
    const days = daysBetween(today, d);
    return days >= -7 && days <= 14;
  }).length;
  
  // Exercise log stats
  const log = DB.exerciseLog || [];
  const last7 = [];
  const last30 = [];
  for (let i = 0; i < 30; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const ds = isoLocal(d);
    const entry = log.find(e => e.date === ds);
    if (i < 7) last7.push(entry);
    last30.push(entry);
  }
  const cvicilLast7 = last7.filter(e => e && e.cvicil === "Y").length;
  const cvicilLast30 = last30.filter(e => e && e.cvicil === "Y").length;
  const pct7 = Math.round(cvicilLast7 / 7 * 100);
  const pct30 = Math.round(cvicilLast30 / 30 * 100);
  
  // Growth
  const ms = (DB.measurements || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const last = ms[ms.length - 1] || {};
  let monthlyGrowth = null;
  if (ms.length >= 2) {
    // Find measurement ~30 days back
    const lastDate = parseDateIso(last.date);
    if (lastDate) {
      const target = new Date(lastDate); target.setDate(target.getDate() - 30);
      // Find closest measurement around 25-35 days back
      let closest = null;
      for (const m of ms) {
        const d = parseDateIso(m.date);
        if (!d) continue;
        const diff = daysBetween(d, lastDate);
        if (diff >= 25 && diff <= 45) {
          if (!closest || Math.abs(diff - 30) < Math.abs(daysBetween(parseDateIso(closest.date), lastDate) - 30)) {
            closest = m;
          }
        }
      }
      if (closest && last.height && closest.height) {
        monthlyGrowth = (last.height - closest.height).toFixed(1);
      }
    }
  }
  
  return {
    today, tasks, openTasks,
    tasksHigh, tasksMid, tasksLow, tasksPlanned, tasksRoutine,
    toBook, in30days, overdue, callsIn14,
    cvicilLast7, cvicilLast30, pct7, pct30,
    lastMeasurement: last, monthlyGrowth
  };
}

function taskList(store) {
  if (store === "admin") { if (!DB.adminTasks) DB.adminTasks = []; return DB.adminTasks; }
  return DB.tasks;
}

const TASK_ASSIGNEES = ["(nikdo)", "Bára", "Michal", "Oba"];
const REPEAT_OPTIONS = ["Ne", "Týdně", "Měsíčně", "Ročně", "Denně"];

// Opakování se odvozuje z vybraného data (žádné ruční psaní dne).
function repeatFromDate(freqLabel, dueDate) {
  const d = parseDateIso(dueDate);
  if (freqLabel === "Denně") return { freq: "daily" };
  if (freqLabel === "Týdně") return { freq: "weekly", weekday: d ? d.getDay() : 1 };
  if (freqLabel === "Měsíčně") return { freq: "monthly", day: d ? d.getDate() : 1 };
  if (freqLabel === "Ročně") return { freq: "yearly", month: d ? d.getMonth() : 0, day: d ? d.getDate() : 1 };
  return null;
}
function repeatFreqLabel(r) {
  if (!r) return "Ne";
  return r.freq === "daily" ? "Denně" : r.freq === "weekly" ? "Týdně" : r.freq === "monthly" ? "Měsíčně" : r.freq === "yearly" ? "Ročně" : "Ne";
}

// ===== Řízené kategorie úkolů (podle modulů v hubu a jejich podsekcí) =====
// Výchozí slovník per store. Péče = podsekce modulu Péče (sloupce = podsekce).
// Úkoly (admin) = ostatní moduly + podsekce ve tvaru "Modul - Podsekce"
// (catParent → sloupec = modul, catSub → podkategorie).
function taskCatDefaults(store) {
  if (store === "admin") return ["Martin", "Dům", "Domácnost", "Ostatní", "Finance", "Geminded"];
  // care
  return ["Vyšetření", "Genetika", "Termíny", "Cvičení", "Rehabilitace", "Růst", "Pomůcky", "Dovednosti"];
}
// Aktuální řízený seznam (uložený) nebo výchozí, když ještě nic uloženo není.
function taskCats(store) {
  const tc = (DB && DB.taskCategories) || {};
  const arr = tc[store];
  return (Array.isArray(arr) && arr.length) ? arr.slice() : taskCatDefaults(store);
}
// Při první správě list zhmotníme do DB, ať je editovatelný a uloží se napevno.
function ensureTaskCats(store) {
  if (!DB.taskCategories || typeof DB.taskCategories !== "object") DB.taskCategories = {};
  if (!Array.isArray(DB.taskCategories[store]) || !DB.taskCategories[store].length) {
    DB.taskCategories[store] = taskCatDefaults(store).slice();
  }
  return DB.taskCategories[store];
}
// Nabídka pro pole = řízený seznam ∪ kategorie už použité na úkolech (ať se nic neztratí).
function taskCatOptions(store) {
  const used = (taskList(store) || []).map(x => x.category).filter(c => c);
  return [...new Set([...taskCats(store), ...used])].sort((a, b) => String(a).localeCompare(String(b), "cs"));
}

// Sdílená pole formuláře pro nový i upravovaný úkol
function taskFormFields(store, t) {
  t = t || {};
  const cats = taskCatOptions(store);
  return [
    { key: "title", label: "Úkol", value: t.title || "" },
    { key: "category", label: "Kategorie (vyber nebo napiš novou)", type: "datalist", options: cats, value: t.category || "", placeholder: "např. Dům, Provoz, Projekt…" },
    { key: "dueDate", label: "Datum (z kalendáře)", type: "date", value: t.dueDate || "" },
    { key: "dueTime", label: "Čas — upozorní tě v tento čas (volitelné)", type: "time", value: t.dueTime || "" },
    { key: "assignee", label: "Řešitel", type: "select", options: TASK_ASSIGNEES, value: t.assignee || "(nikdo)" },
    { key: "repeatFreq", label: "Opakování (odvodí se z data)", type: "select", options: REPEAT_OPTIONS, value: repeatFreqLabel(t.repeat) },
    { key: "priority", label: "Priorita", type: "select", options: ["Vysoká", "Střední", "Nízká", "Plánováno", "Stálé"], value: t.priority || "Střední" },
    { key: "status", label: "Status", type: "select", options: ["Otevřeno", "Hotovo", "Průběžně", "Zrušeno"], value: t.status || "Otevřeno" },
    { key: "contact", label: "Zadání — co je potřeba (klidně odrážky)", type: "textarea", value: t.contact || "" },
    { key: "solution", label: "Řešení / průběh — co se zatím udělalo", type: "textarea", value: t.solution || "" },
    { key: "subtasks", label: "Položky", type: "subtasks", value: t.subtasks || [] }
  ];
}

function applyTaskForm(t, data) {
  const repeat = repeatFromDate(data.repeatFreq, data.dueDate);
  const assignee = data.assignee === "(nikdo)" ? "" : data.assignee;
  delete data.repeatFreq;
  const done = data.status === "Hotovo" || data.status === "Splněno";
  const subtasks = data.subtasks || t.subtasks || [];
  delete data.subtasks;
  const out = { ...t, ...data, assignee, repeat, subtasks, done };
  // připomínka: datum + čas → remindAt (ISO). Při změně času/data znovu povol upozornění.
  const remindAt = (out.dueDate && out.dueTime) ? (out.dueDate + "T" + out.dueTime) : "";
  if (remindAt !== (t.remindAt || "")) out.notified = false;
  out.remindAt = remindAt;
  if (done && !out.completedDate) out.completedDate = isoLocal();
  if (!done) out.completedDate = "";
  return out;
}

function nextOccurrenceIso(t, fromDate) {
  const start = new Date(fromDate); start.setHours(0, 0, 0, 0);
  for (let i = 1; i <= 400; i++) {
    const d = new Date(start); d.setDate(d.getDate() + i);
    if (occursOn(t, d)) return isoLocal(d);
  }
  return "";
}

function toggleTask(store, i) {
  const list = taskList(store);
  const t = list[i];
  if (!t.done && t.repeat) {
    // opakovaný úkol: odškrtnutí ho posune na další výskyt, nezmizí navždy
    const base = parseDateIso(t.dueDate) || new Date();
    const next = nextOccurrenceIso(t, base > new Date() ? base : new Date());
    t.lastDone = isoLocal();
    if (next) t.dueDate = next;
    if (t.remindAt) { t.remindAt = next + (t.dueTime ? "T" + t.dueTime : ""); t.notified = false; }
    save();
    renderAll();
    return;
  }
  t.done = !t.done;
  t.status = t.done ? "Hotovo" : "Otevřeno";
  if (t.done && !t.completedDate) t.completedDate = isoLocal();
  if (!t.done) t.completedDate = "";
  save();
  renderAll();
}

function deleteTask(store, i) {
  const list = taskList(store);
  if (confirm("Smazat úkol „" + list[i].title + "“?")) {
    list.splice(i, 1);
    save();
    renderAll();
  }
}

function editTask(store, i) {
  const list = taskList(store);
  const t = list[i];
  openModal("Upravit úkol", taskFormFields(store, t), data => {
    list[i] = applyTaskForm(t, data);
  });
}

// Rychlé přidání z hubu: 3 pole, ukládá do modulu Úkoly

  ensureTaskCats(store);
  // Vlastní obsah v #modalFields; footer „Uložit" jen zavře (změny se ukládají hned).

function renderCatManager(store) {
  const cats = ensureTaskCats(store);
  const hint = store === "care"
    ? "Podsekce modulu Péče. Jeden název = jeden sloupec/sekce."
    : "Tvar „Modul – Podsekce“ (sloupec = modul). Např. Finance - Rozpočet.";

      <button type="button" class="icon-btn" onclick="catMgrDel('${store}',${i})" title="Smazat z nabídky">✕</button>
    </div>`).join("") : `<div style="font-size:12px;color:var(--ink-muted);padding:4px 0">Zatím žádné kategorie.</div>`;
  return `
    <div class="field">
      <label>Kategorie pro: ${store === "care" ? "Péče — Martin" : "Úkoly"}</label>
      <div style="font-size:12px;color:var(--ink-muted);margin-bottom:10px">${esc(hint)}</div>
      <div id="catMgrList">${rows}</div>
      <div class="sub-edit-row" style="margin-top:10px">
        <input type="text" id="catMgrNew" class="sub-edit-input" placeholder="Přidat novou kategorii…"

      </div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:8px">
        Přejmenování upraví i kategorii u existujících úkolů. Smazání jen ubere z nabídky (úkoly zůstanou).
      </div>
    </div>`;
}
function refreshCatManager(store) {
  const list = document.getElementById("catMgrList");
  if (list) list.innerHTML = ensureTaskCats(store).map((c, i) => `
    <div class="sub-edit-row">
      <input type="text" class="sub-edit-input" data-cat="${i}" value="${esc(c)}"
             onchange="catMgrRename('${store}',${i},this.value)" placeholder="Název kategorie…">
      <button type="button" class="icon-btn" onclick="catMgrDel('${store}',${i})" title="Smazat z nabídky">✕</button>
    </div>`).join("");
}
function catMgrAdd(store) {
  const arr = ensureTaskCats(store);
  const inp = document.getElementById("catMgrNew");
  const v = inp ? inp.value.trim() : "";
  if (!v) return;
  if (arr.some(c => c.toLowerCase() === v.toLowerCase())) { if (inp) inp.value = ""; return; }
  arr.push(v);
  if (inp) inp.value = "";
  save();
  refreshCatManager(store);
}
function catMgrRename(store, i, val) {
  const arr = ensureTaskCats(store);
  const nw = String(val || "").trim();
  const old = arr[i];
  if (!nw || nw === old) { refreshCatManager(store); return; }
  if (arr.some((c, j) => j !== i && c.toLowerCase() === nw.toLowerCase())) { refreshCatManager(store); return; }
  arr[i] = nw;
  // Přepiš i kategorii na existujících úkolech (přesná shoda).
  (taskList(store) || []).forEach(t => { if (t.category === old) t.category = nw; });
  save();
  renderAll();
  refreshCatManager(store);
}
function catMgrDel(store, i) {
  const arr = ensureTaskCats(store);
  arr.splice(i, 1);
  save();
  refreshCatManager(store);
}

// ===== Připomínky úkolů (lokální notifikace / „budík") =====
let _reminderLoop = null;
function notifyState() { return (typeof Notification === "undefined") ? "unsupported" : Notification.permission; }
function enableNotifications() {
  if (typeof Notification === "undefined") { alert("Tento prohlížeč notifikace nepodporuje."); return; }
  Notification.requestPermission().then(p => {
    if (p === "granted") { alert("Připomínky zapnuty ✓\n\nU úkolu nastav datum + čas a appka tě v ten čas upozorní.\nFunguje, když je appka otevřená nebo běží na pozadí (na telefonu ji nech jako appku na ploše)."); checkReminders(); }
    else alert("Notifikace nejsou povolené. Můžeš je zapnout v nastavení prohlížeče u této stránky.");
    if (!currentModule) renderHub();
  }).catch(() => {});
}
function showTaskNotification(title, body) {
  const opts = { body: body || "", icon: "icon-192.png", badge: "icon-192.png", tag: title, renotify: true };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(title, opts)).catch(() => { try { new Notification(title, opts); } catch (e) { } });
    } else { new Notification(title, opts); }
  } catch (e) { try { new Notification(title, opts); } catch (e2) { } }
}
function checkReminders() {
  if (!DB || notifyState() !== "granted") return;
  const now = Date.now(); let changed = false;
  [DB.tasks || [], DB.adminTasks || []].forEach(list => {
    list.forEach(t => {
      if (!t || t.done || t.notified || !t.remindAt) return;
      const due = new Date(t.remindAt).getTime(); if (isNaN(due)) return;
      if (due <= now) {
        // upozorni jen u nedávno splatných (do 12 h zpět), starší jen tiše označ
        if (now - due < 12 * 3600 * 1000) showTaskNotification("🔔 " + (t.title || "Úkol"), (t.category ? t.category + " · " : "") + "Naplánováno na " + t.remindAt.replace("T", " "));
        t.notified = true; changed = true;
      }
    });
  });
  if (changed) persistNow(); // tichý zápis bez undo kroku — jde jen o příznak "upozorněno"
}
function startReminderLoop() {
  if (_reminderLoop) return;
  _reminderLoop = setInterval(checkReminders, 60000);
  checkReminders();
}

// Import úkolů z JSON souboru (admin úkoly -> modul Úkoly, dětské -> Péče).
function normalizeImportedTask(t) {
  return {
    title: t.title || "", category: t.category || "", priority: t.priority || "Střední",
    deadline: t.deadline || "", dueDate: t.dueDate || "", assignee: t.assignee || "",
    repeat: t.repeat || null, status: t.status || "Otevřeno", contact: t.contact || "", solution: t.solution || "",
    dueTime: t.dueTime || "", remindAt: t.remindAt || "", notified: !!t.notified,
    subtasks: Array.isArray(t.subtasks) ? t.subtasks.map(s => ({ text: s.text || "", done: !!s.done })) : [],
    done: !!t.done, completedDate: t.completedDate || ""
  };
}

// ===== Jednotná volba importu (Přepsat vše / Sloučit / Zrušit) — napříč všemi moduly =====
let _impReplace = null, _impMerge = null;
function importChoice(title, msg, onReplace, onMerge) {
  _impReplace = onReplace; _impMerge = onMerge;
  let el = document.getElementById("importChoiceBg");
  if (!el) { el = document.createElement("div"); el.id = "importChoiceBg"; el.className = "modal-bg"; document.body.appendChild(el); }
  el.innerHTML = `<div class="modal" style="max-width:480px">
      <div class="modal-title">${esc(title)}</div>
      <p style="font-size:13px;color:var(--ink-soft);line-height:1.6;margin:0">${msg}</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
        <button class="btn primary" style="text-align:left;padding:11px 14px" onclick="importChoicePick('merge')">✓ Sloučit — doplnit jen nové, mé úpravy ponechat</button>
        <button class="btn" style="text-align:left;padding:11px 14px" onclick="importChoicePick('replace')">⟳ Přepsat vše ze souboru (nahradí i to, cos měnila)</button>
        <button class="btn" style="text-align:left;padding:11px 14px" onclick="importChoicePick('cancel')">✕ Zrušit</button>
      </div></div>`;
  el.classList.add("show");
}
function importChoicePick(mode) {
  const el = document.getElementById("importChoiceBg"); if (el) el.classList.remove("show");
  const r = _impReplace, m = _impMerge; _impReplace = _impMerge = null;
  if (mode === "replace" && r) r();
  else if (mode === "merge" && m) m();
}
// upsert kolekce dle klíče; 'replace' přepíše shodné položky, 'merge' je ponechá; obojí přidá nové
function mergeCollection(target, incoming, keyFn, normalize, mode, prepend) {
  let added = 0, updated = 0, kept = 0;
  if (!Array.isArray(incoming)) return { added, updated, kept };
  const idx = new Map(); target.forEach((x, i) => idx.set(keyFn(x), i));
  incoming.forEach(raw => {
    const item = normalize ? normalize(raw) : raw;
    if (item == null) return;
    const k = keyFn(item);
    if (idx.has(k)) { if (mode === "replace") { target[idx.get(k)] = item; updated++; } else kept++; }
    else { if (prepend) target.unshift(item); else target.push(item); idx.set(k, target.length - 1); added++; }
  });
  return { added, updated, kept };
}
function importChoiceMsg() { return "Vyber, jak naložit s daty, která už v appce máš:<br><b>Sloučit</b> = přidá jen nové položky a tvé úpravy v appce nechá být.<br><b>Přepsat vše</b> = položky se stejným názvem nahradí verzí ze souboru."; }

function importTasksFromJson() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!DB.adminTasks) DB.adminTasks = [];
        const normT = t => t && t.title ? normalizeImportedTask(t) : null;
        const hasDup = (obj.adminTasks || []).some(t => t.title && DB.adminTasks.some(x => x.title === t.title))
          || (obj.careTasks || []).some(t => t.title && DB.tasks.some(x => x.title === t.title));
        const run = (mode) => {
          const a = mergeCollection(DB.adminTasks, obj.adminTasks, t => t.title, normT, mode, false);
          const c = mergeCollection(DB.tasks, obj.careTasks, t => t.title, normT, mode, true);
          save(); renderAll(); if (!currentModule) renderHub();
          alert("Import úkolů hotový.\nAdmin: +" + a.added + " nových" + (a.updated ? ", " + a.updated + " přepsáno" : "") + (a.kept ? ", " + a.kept + " ponecháno" : "") + "\nPéče: +" + c.added + " nových" + (c.updated ? ", " + c.updated + " přepsáno" : "") + (c.kept ? ", " + c.kept + " ponecháno" : ""));
        };
        if (hasDup) importChoice("Import úkolů (admin + péče)", importChoiceMsg(), () => run("replace"), () => run("merge"));
        else run("replace");
      } catch (e) {
        alert("Soubor se nepodařilo načíst: " + e.message);
      }
    };
    reader.readAsText(f, "utf-8");
  };
  inp.click();
}

function maybeDailySnapshot() {
  if (!DB) return;
  if (!Array.isArray(snapshots)) snapshots = [];
  const today = isoLocal();
  if (snapshots.some(s => s.date === today)) return; // dnešní snímek už existuje
  // objemná historická data energií do snímku nedáváme (kvůli limitu velikosti); obnova přes Import
  const slim = JSON.parse(JSON.stringify(DB));
  if (slim.energy) slim.energy.measurements = [];
  if (slim.finance) slim.finance.predikce = [];
  snapshots.push({ date: today, ts: Date.now(), data: slim });
  if (snapshots.length > SNAP_MAX) snapshots = snapshots.slice(-SNAP_MAX); // drž posledních N dní
  persistSnapshots();
}

  const s = (snapshots || []).find(x => x.date === date);
  if (!s) return;
  if (!confirm("Obnovit data ze dne " + date + "?\n\nAktuální stav bude přepsán stavem z tohoto snímku. (Dnešní snímek zůstává, takže i tento krok jde vzít zpět.)")) return;
  DB = JSON.parse(JSON.stringify(s.data));
  migrateAssignees(DB); // doplní chybějící klíče (ensureShape) + sjednotí řešitele

function restoreFromFile() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || typeof obj !== "object" || !("tasks" in obj)) {
          alert("Tohle nevypadá jako celá záloha appky (chybí pole „tasks“). Pro import jen úkolů použij „Import úkolů“ na hubu.");

      } catch (e) {

let taskAssigneeFilter = "all"; // filtr úkolů podle řešitele
let taskView = "active";        // 'active' (kanban) | 'done' (splněno)
let taskLayout = "table";       // 'table' | 'kanban'

function fmtDateShort(iso) {
  const d = parseDateIso(iso);
  if (!d) return "";
  return WEEKDAYS_CZ[d.getDay()] + " " + d.getDate() + ". " + (d.getMonth() + 1) + ".";
}

function toggleSubtask(store, ti, si) {
  const t = taskList(store)[ti];
  if (!t || !t.subtasks || !t.subtasks[si]) return;
  t.subtasks[si].done = !t.subtasks[si].done;
  save();
  renderAll();
}

// Nadřazená kategorie (před „ - ") pro sloučení sloupců, a podkategorie pro štítek
// Barevný odznak termínu podle legendy: po termínu / do 6 dní / 7–14 dní / později / bez termínu
function dueBadge(t) {
  if (t.done) return "";
  const d = parseDateIso(t.dueDate);
  if (!d) return `<span class="due-b due-none">bez termínu</span>`;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = daysBetween(today, d);
  const lbl = fmtDateShort(t.dueDate) + (t.dueTime ? " " + t.dueTime : "");
  if (days < 0)  return `<span class="due-b due-over">⚠ ${esc(lbl)} · ${-days} d po termínu</span>`;
  if (days === 0) return `<span class="due-b due-soon">dnes${t.dueTime ? " " + esc(t.dueTime) : ""}</span>`;
  if (days <= 6)  return `<span class="due-b due-soon">${esc(lbl)} · za ${days} d</span>`;
  if (days <= 14) return `<span class="due-b due-mid">${esc(lbl)} · za ${days} d</span>`;
  return `<span class="due-b due-later">${esc(lbl)}</span>`;
}

function catParent(c) { return String(c || "").split(/\s[-–—]\s/)[0].trim() || "(bez kategorie)"; }
function catSub(c) { const p = String(c || "").split(/\s[-–—]\s/); return p.length > 1 ? p.slice(1).join(" – ").trim() : ""; }
// Časové řazení i pro české textové termíny („květen 2026", „léto 2026", „únor 2027")
const MONTHS_CZ_MAP = { "leden": 1, "únor": 2, "unor": 2, "březen": 3, "brezen": 3, "duben": 4, "květen": 5, "kveten": 5, "červenec": 7, "cervenec": 7, "červen": 6, "cerven": 6, "srpen": 8, "září": 9, "zari": 9, "říjen": 10, "rijen": 10, "listopad": 11, "prosinec": 12 };
const SEASON_CZ = { "jaro": 3, "léto": 7, "leto": 7, "podzim": 10, "zima": 1 };
function careDateKey(due) {
  if (!due) return "9999-98";
  const s = String(due).trim().toLowerCase();
  const iso = s.match(/(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if (iso) return iso[1] + "-" + iso[2] + "-" + (iso[3] || "01");
  const ym = s.match(/(20\d{2})/); const year = ym ? ym[1] : null;
  if (year) {
    const names = Object.keys(MONTHS_CZ_MAP).sort((a, b) => b.length - a.length); // delší dřív (červenec před červen)
    for (const n of names) if (s.indexOf(n) >= 0) return year + "-" + String(MONTHS_CZ_MAP[n]).padStart(2, "0") + "-01";
    for (const se in SEASON_CZ) if (s.indexOf(se) >= 0) return year + "-" + String(SEASON_CZ[se]).padStart(2, "0") + "-15";
    return year + "-06-30"; // jen rok
  }
  return "9999-99"; // neparsovatelné (např. „15+ let", „1. neděle…") = na konec
}

function taskCard(t, idx, store) {
  const isDone = t.done || t.status === "Hotovo" || t.status === "Splněno";
  const sub = catSub(t.category);
  const dateLbl = t.dueDate ? fmtDateShort(t.dueDate) : (t.deadline || "");
  const subs = t.subtasks || [];
  const open = subs.filter(s => !s.done);
  const doneN = subs.length - open.length;
  const SHOWN = 6;
  let subHtml = "";
  if (subs.length) {
    const shownList = [...open, ...subs.filter(s => s.done)].slice(0, SHOWN);
    subHtml = `<div class="kan-subs">` +
      shownList.map(s => {
        const si = subs.indexOf(s);
        return `<div class="kan-sub ${s.done ? "tsub-isdone" : ""}" onclick="event.stopPropagation();toggleSubtask('${store}',${idx},${si})"><span class="kan-sub-box ${s.done ? "done" : ""}">${s.done ? "✓" : ""}</span><span class="kan-sub-txt">${esc(s.text)}</span></div>`;
      }).join("") +
      (subs.length > SHOWN ? `<div class="kan-sub-more">+ ${subs.length - SHOWN} dalších…</div>` : "") +
      `</div>`;
  } else if (t.contact) {
    subHtml = `<div class="kan-note">${esc(t.contact)}</div>`;
  }
  if (t.solution) subHtml += `<div class="kan-note kan-solution">✎ ${esc(t.solution)}</div>`;
  return `
    <div class="kan-card" onclick="editTask('${store}',${idx})">
      <div class="kan-check ${isDone ? 'done' : ''}" onclick="event.stopPropagation();toggleTask('${store}',${idx})"></div>
      <div class="kan-cbody">
        <div class="kan-title ${isDone ? 'done' : ''}">${esc(t.title || '')}</div>
        ${subHtml}
        <div class="kan-meta">
          ${sub ? `<span class="tag neutral">${esc(sub)}</span>` : ''}
          ${dueBadge(t)}
          ${t.remindAt ? `<span class="tag ${t.notified ? 'neutral' : 'yellow'}">🔔${t.notified ? ' ✓' : ''}</span>` : ''}
          ${subs.length ? `<span class="kan-prog">${doneN}/${subs.length}</span>` : ''}

function doneSubtasks(list) {
  const out = [];
  (list || []).forEach((t, ti) => (t.subtasks || []).forEach((s, si) => {
    if (s.done) out.push({ ti, si, text: s.text || "", parent: t.title || "", cat: catParent(t.category), sub: catSub(t.category) });
  }));
  return out;
}
function doneSubRow(store, e) {
  return `
    <div class="item-row">
      <input type="checkbox" class="done-sel" data-kind="sub" data-ti="${e.ti}" data-si="${e.si}" title="Vybrat ke smazání">
      <div class="item-body">
        <div class="item-title done">${esc(e.text)}</div>
        <div class="item-meta">
          <span class="tag neutral">${esc(e.cat)}</span>
          ${e.sub ? `<span class="tag neutral">${esc(e.sub)}</span>` : ""}
          ${e.parent ? `<span style="color:var(--ink-muted)">položka z: ${esc(e.parent)}</span>` : ""}
        </div>
      </div>
      <div class="row-actions" style="opacity:1">
        <button class="btn" onclick="toggleSubtask('${store}',${e.ti},${e.si})">↩ Obnovit</button>
        <button class="icon-btn" onclick="deleteDoneSub('${store}',${e.ti},${e.si})" title="Smazat natrvalo">✕</button>
      </div>
    </div>`;
}
function deleteDoneSub(store, ti, si) {
  const t = taskList(store)[ti]; if (!t || !t.subtasks || !t.subtasks[si]) return;
  t.subtasks.splice(si, 1); save(); renderAll();
}
function deleteSelectedDone(store) {
  const boxes = document.querySelectorAll(".done-sel:checked");
  if (!boxes.length) { alert("Nic nevybráno — zaškrtni položky, které chceš smazat."); return; }
  if (!confirm("Smazat " + boxes.length + " vybraných splněných? (lze vrátit přes ↶ Zpět)")) return;
  const L = taskList(store);
  const taskRefs = [], subRefs = [];
  boxes.forEach(b => {
    const ti = +b.dataset.ti;
    if (b.dataset.kind === "task") { if (L[ti]) taskRefs.push(L[ti]); }
    else { const t = L[ti]; if (t && t.subtasks && t.subtasks[+b.dataset.si]) subRefs.push({ t, s: t.subtasks[+b.dataset.si] }); }
  });
  subRefs.forEach(r => { const i = r.t.subtasks.indexOf(r.s); if (i >= 0) r.t.subtasks.splice(i, 1); });
  taskRefs.forEach(t => { const i = L.indexOf(t); if (i >= 0) L.splice(i, 1); });
  save(); renderAll();
}
function deleteAllDone(store) {
  const L = taskList(store);
  const isD = t => t.done || t.status === "Hotovo" || t.status === "Splněno";
  const nTasks = L.filter(isD).length;
  let nSubs = 0; L.forEach(t => (t.subtasks || []).forEach(s => { if (s.done) nSubs++; }));
  if (!nTasks && !nSubs) { alert("Žádné splněné k smazání."); return; }
  if (!confirm("Smazat všechny splněné úkoly i položky (" + (nTasks + nSubs) + ")? (lze vrátit přes ↶ Zpět)")) return;
  L.forEach(t => { if (t.subtasks) t.subtasks = t.subtasks.filter(s => !s.done); });
  for (let i = L.length - 1; i >= 0; i--) if (isD(L[i])) L.splice(i, 1);
  save(); renderAll();
}

let taskDueFilter = "all"; // all | today | week | overdue

function taskDueMatch(t) {
  if (taskDueFilter === "all") return true;
  const d = parseDateIso(t.dueDate);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (taskDueFilter === "overdue") return d && d < today;
  if (!d && !t.repeat) return false;
  const days = d ? daysBetween(today, d) : null;
  if (taskDueFilter === "today") return (days !== null && days === 0) || (t.repeat && occursOn(t, today));
  if (taskDueFilter === "week") {
    if (days !== null && days <= 7) return true;
    if (t.repeat) { for (let i = 0; i <= 7; i++) { const x = new Date(today); x.setDate(x.getDate() + i); if (occursOn(t, x)) return true; } }
    return false;
  }
  return true;
}

function renderTasks(store) {
  store = store || "care";
  const list = taskList(store);
  const af = taskAssigneeFilter;
  const matchA = t => (af === "all" || (t.assignee || "") === af || t.assignee === "Oba") && taskDueMatch(t);
  const isDone = t => t.done || t.status === "Hotovo" || t.status === "Splněno";

  const matchAOnly = t => af === "all" || (t.assignee || "") === af || t.assignee === "Oba";
  const openTasks = list.filter(t => !isDone(t) && matchA(t));
  const doneTasks = list.filter(t => isDone(t) && matchAOnly(t)); // archiv nefiltrujeme termínem
  const openCnt = list.filter(t => !isDone(t)).length;
  const doneSubs = doneSubtasks(list);
  const doneCnt = list.filter(t => isDone(t)).length + doneSubs.length;

  const assigneeBtns = ["all", "Bára", "Michal"].map(a =>
    `<button class="filter-btn ${af === a ? 'active' : ''}" onclick="taskAssigneeFilter='${a}'; renderAll()">${a === 'all' ? 'Vše' : a}</button>`).join("");

  let head = `
    <div class="page-header">
      <div>
        <div class="page-title">Úkoly</div>
        <div class="page-subtitle">${openCnt} aktivních · ${doneCnt} splněných</div>
      </div>
      <div class="page-actions">
        ${store === "admin" ? `<button class="btn" onclick="importTasksFromJson()">↥ Import (JSON)</button>` : ""}
        <button class="btn" onclick="manageCategories('${store}')">⚙ Kategorie</button>
        <button class="btn primary" onclick="addTask('${store}')">+ Nový úkol</button>
      </div>
    </div>
    <div class="filters">
      <button class="filter-btn ${taskView === 'active' ? 'active' : ''}" onclick="taskView='active'; renderAll()">Aktivní</button>
      <button class="filter-btn ${taskView === 'done' ? 'active' : ''}" onclick="taskView='done'; renderAll()">🗂 Archiv · ${doneCnt}</button>
      ${taskView === 'active' ? `<span style="margin-left:auto;display:inline-flex;gap:6px">
        <button class="filter-btn ${taskLayout === 'table' ? 'active' : ''}" onclick="taskLayout='table'; renderAll()">▤ Tabulka</button>
        <button class="filter-btn ${taskLayout === 'kanban' ? 'active' : ''}" onclick="taskLayout='kanban'; renderAll()">▦ Kanban</button>
      </span>` : ''}
    </div>
    <div class="filters" style="margin-top:-8px">
      <span style="font-size:11px;color:var(--ink-muted);align-self:center;margin-right:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Řešitel:</span>
      ${assigneeBtns}
      <span style="margin-left:auto;display:inline-flex;gap:6px">
        <button class="filter-btn ${taskDueFilter === 'all' ? 'active' : ''}" onclick="taskDueFilter='all'; renderAll()">Vše</button>
        <button class="filter-btn ${taskDueFilter === 'today' ? 'active' : ''}" onclick="taskDueFilter='today'; renderAll()">Dnes</button>
        <button class="filter-btn ${taskDueFilter === 'week' ? 'active' : ''}" onclick="taskDueFilter='week'; renderAll()">Do týdne</button>
        <button class="filter-btn ${taskDueFilter === 'overdue' ? 'active' : ''}" onclick="taskDueFilter='overdue'; renderAll()">Po termínu</button>
      </span>
    </div>`;

  if (taskView === "done") {
    const hasDone = doneTasks.length || doneSubs.length;
    return head + `
      ${hasDone ? `<div class="done-toolbar">
        <label class="done-selall"><input type="checkbox" onchange="document.querySelectorAll('.done-sel').forEach(b=>b.checked=this.checked)"> Vybrat vše</label>
        <button class="btn" onclick="deleteSelectedDone('${store}')">🗑 Smazat vybrané</button>
        <button class="btn" onclick="deleteAllDone('${store}')">Smazat vše splněné</button>
      </div>` : ""}
      <div class="list-wrap">
        ${doneTasks.map(t => doneRow(t, list.indexOf(t), store)).join("")}
        ${doneSubs.map(e => doneSubRow(store, e)).join("")}
        ${!hasDone ? `<div class="empty">Archiv je prázdný — hotové úkoly se sem schovají samy.</div>` : ""}
      </div>`;
  }

  // Skupiny po NADŘAZENÉ kategorii (GENETIKA + GENETIKA – MATKA → jeden sloupec), uvnitř časově
  const byCat = {};
  openTasks.forEach(t => { const c = catParent(t.category); (byCat[c] = byCat[c] || []).push(t); });
  const cats = Object.keys(byCat).sort((a, b) =>
    a === "(bez kategorie)" ? 1 : b === "(bez kategorie)" ? -1 : a.localeCompare(b, "cs"));
  cats.forEach(c => byCat[c].sort((a, b) => careDateKey(a.dueDate).localeCompare(careDateKey(b.dueDate)) || (a.title || "").localeCompare(b.title || "", "cs")));

  if (!cats.length) return head + `<div class="empty">Žádné aktivní úkoly — přidej nový tlačítkem „+ Nový úkol“.</div>`;

  if (taskLayout === "table") return head + renderTaskTable(cats, byCat, list, store);

  // KANBAN
  const cols = cats.map(c => { const col = catColor(c); return `
    <div class="kan-col" style="border-top:3px solid ${col.c}">
      <div class="kan-col-head" style="color:${col.c}">${esc(c)}<span class="kan-count" style="background:${col.c}">${byCat[c].length}</span></div>
      ${byCat[c].map(t => taskCard(t, list.indexOf(t), store)).join("")}
    </div>`; }).join("");
  return head + `<div class="kanban">${cols}</div>`;
}

// Tabulkový pohled: kategorie jako sekce, úkoly pod sebou seřazené dle termínu, rozbalitelné položky
function renderTaskTable(cats, byCat, list, store) {
  return `<div class="ttbl">` + cats.map(c => {
    const col = catColor(c);
    const rows = byCat[c].map(t => {
      const idx = list.indexOf(t);
      const key = store + ":" + idx;
      const isDone = t.done || t.status === "Hotovo" || t.status === "Splněno";
      const subs = t.subtasks || [];
      const doneN = subs.filter(s => s.done).length;
      const sub = catSub(t.category);
      const dateLbl = t.dueDate ? fmtDateShort(t.dueDate) : (t.deadline || "");
      const expanded = taskExpanded[key] !== false; // defaultně rozbaleno (položky vidět „ven")
      let subRows = "";
      if (expanded && subs.length) {
        subRows = `<div class="tsubs" style="border-left:2px solid ${col.bg}">` + subs.map((s, si) => `
          <div class="tsub ${s.done ? "tsub-isdone" : ""}" onclick="toggleSubtask('${store}',${idx},${si})">
            <span class="tsub-box ${s.done ? "done" : ""}">${s.done ? "✓" : ""}</span>
            <span class="tsub-txt">${esc(s.text)}</span>
          </div>`).join("") + `</div>`;
      }
      if (expanded && (t.contact || t.solution)) {
        subRows += `<div class="tsubs" style="border-left:2px solid ${col.bg}">` +
          (t.contact ? `<div class="tsub-note">${esc(t.contact)}</div>` : "") +
          (t.solution ? `<div class="tsub-note tsub-solution">✎ Řešení: ${esc(t.solution)}</div>` : "") + `</div>`;
      }
      return `
        <div class="trow" style="border-left:3px solid ${col.c}">
          <span class="tcheck ${isDone ? 'done' : ''}" onclick="toggleTask('${store}',${idx})" title="Hotovo / aktivní"></span>
          <span class="tdue-left">${dueBadge(t)}</span>
          <span class="ttitle" style="color:${col.c};font-weight:600" onclick="editTask('${store}',${idx})">${esc(t.title || "")}${sub ? ` <span class="tag neutral">${esc(sub)}</span>` : ""}</span>
          <span class="tmeta">
            ${t.remindAt ? `<span class="tag ${t.notified ? 'neutral' : 'yellow'}">🔔${t.notified ? " ✓" : ""}</span>` : ""}
            ${t.repeat ? `<span class="tag neutral">↻</span>` : ""}
            ${assigneeBadge(t.assignee)}
            ${(subs.length || t.contact || t.solution) ? `<button class="texp" onclick="toggleTaskExpand('${esc(key)}')">${subs.length ? doneN + "/" + subs.length : "pozn."} ${expanded ? "▾" : "▸"}</button>` : ""}
            <button class="icon-btn" onclick="editTask('${store}',${idx})" title="Upravit">✎</button>
          </span>
        </div>
        ${subRows}`;
    }).join("");
    return `
      <div class="tcat" style="border-left:4px solid ${col.c}">
        <div class="tcat-head" style="color:${col.c}">${esc(c)} <span class="kan-count" style="background:${col.c}">${byCat[c].length}</span></div>
        ${rows}
      </div>`;
  }).join("") + `</div>`;
}

function parseDate(d) {
  // "4/2022" -> 2022-04, "11/2025" -> 2025-11, "2026-05" / "2026-05-21" -> ISO
  const iso = String(d).match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/);
  if (iso) return new Date(parseInt(iso[1]), parseInt(iso[2]) - 1, iso[3] ? parseInt(iso[3]) : 1);
  const m = String(d).match(/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(parseInt(m[2]), parseInt(m[1]) - 1);
  return new Date(0);
}
// Zobrazení měsíce: "2026-05" -> "05/2026", "MM/RRRR" nechá být
function fmtMonthCz(d) {
  const full = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (full) return (+full[3]) + ". " + (+full[2]) + ". " + full[1];
  const iso = String(d || "").match(/^(\d{4})-(\d{2})/);
  if (iso) return iso[2] + "/" + iso[1];
  return String(d || "");
}

function mmYyyyToMonth(s) {
  if (!s) return "";
  const iso = String(s).match(/^(\d{4})-(\d{2})/); if (iso) return iso[1] + "-" + iso[2];
  const m = String(s).match(/^(\d{1,2})\s*\/\s*(\d{4})$/); if (m) return m[2] + "-" + String(m[1]).padStart(2, "0");
  return ""; // neznámý formát -> prázdné (uživatel vybere)
}

          </div>` : ""}
      </div>
    `).join("")}
  `;
}

let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let openDayDetail = null; // ISO date string of day with open detail

function appointmentsForDate(isoDate) {
  return (DB.appointments || []).filter(a => 
    a.budouciDate === isoDate || a.terminVolaniDate === isoDate
  );
}

function renderAppointments() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const all = (DB.appointments || []);
  const isPast = a => { const d = parseDateIso(a.budouciDate); return d && d < today; };
  const planned = all.filter(a => !isPast(a)).sort((a, b) => {
    const da = parseDateIso(a.budouciDate), dbb = parseDateIso(b.budouciDate);
    if (da && dbb) return da - dbb;
    if (da) return -1; if (dbb) return 1; return 0;
  });
  const done = all.filter(isPast).sort((a, b) => (b.budouciDate || "").localeCompare(a.budouciDate || ""));
  const card = a => apptCard(a);
  return `
    <div class="page-header">
      <div>
        <div class="page-title">Kontroly u lékařů</div>
        <div class="page-subtitle">${planned.length} naplánovaných · ${done.length} realizovaných · kalendář najdeš na Přehledu</div>
      </div>
      <div class="page-actions">
        <button class="btn primary" onclick="addAppt()">+ Nová kontrola</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">🗓 Naplánované <div class="section-title-line"></div></div>
      <div class="appt-cards">
        ${planned.length ? planned.map(card).join("") : `<div class="empty" style="padding:16px">Nic naplánovaného — přidej tlačítkem „+ Nová kontrola“.</div>`}

        ${done.length ? done.map(card).join("") : `<div class="empty" style="padding:16px">Zatím žádné proběhlé kontroly.</div>`}
      </div>
    </div>

}

function apptCard(a) {
  const i = DB.appointments.indexOf(a);
  return `<div class="appt-card">
            <div class="appt-card-head">
              <div>
                <div class="appt-name">${esc(a.ambulance || "")}</div>
                ${a.lekar || a.kde ? `<div class="appt-doc">${esc(a.lekar || "")}${a.lekar && a.kde ? " · " : ""}${esc(a.kde || "")}</div>` : ""}
              </div>
              <div>${formatDateCell(a.budouciDate, a.budouciText)}</div>
            </div>
            <div class="appt-meta">
              ${a.cas ? `<span>⏰ ${esc(a.cas)}</span>` : ""}
              ${a.frekvence ? `<span>🔁 ${esc(a.frekvence)}</span>` : ""}
              ${a.posledniDate || a.posledniText ? `<span>poslední: ${esc(a.posledniDate || a.posledniText)}</span>` : ""}
              ${a.terminVolaniDate ? `<span style="color:var(--yellow)">volat ${esc(a.terminVolaniDate)}</span>` : ""}
              ${a.telefon ? `<a href="tel:${esc(a.telefon)}" style="color:var(--sec)">${esc(a.telefon)}</a>` : ""}
              ${a.email ? `<a href="mailto:${esc(a.email)}" style="color:var(--sec)">${esc(a.email)}</a>` : ""}

              <button class="icon-btn" onclick="deleteRow('appointments', ${i}, 'kontrolu')">✕</button>
            </div>
          </div>`;
}

function formatDateCell(isoDate, textValue) {
  if (textValue && /OBJEDNAT/i.test(textValue)) return `<span class="tag red">${esc(textValue)}</span>`;
  if (textValue) return `<span class="tag yellow">${esc(textValue)}</span>`;
  if (!isoDate) return '<span style="color:var(--ink-muted)">—</span>';
  const d = parseDateIso(isoDate);
  if (!d) return esc(isoDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const days = daysBetween(today, d);
  let cls = "neutral";
  if (days < 0) cls = "red";
  else if (days <= 30) cls = "yellow";
  else if (days <= 90) cls = "blue";
  return `<code class="kbd">${esc(isoDate)}</code> <span class="tag ${cls}">${days < 0 ? `před ${-days}d` : `za ${days}d`}</span>`;
}

function renderCalendarWidget() {
  const m = calMonth;
  const year = m.getFullYear();
  const month = m.getMonth();
  const monthNames = ["Leden","Únor","Březen","Duben","Květen","Červen","Červenec","Srpen","Září","Říjen","Listopad","Prosinec"];
  const dayNames = ["Po","Út","St","Čt","Pá","So","Ne"];
  
  // First day of month, day of week (0=Mon..6=Sun)
  const firstDay = new Date(year, month, 1);
  let startOfs = firstDay.getDay() - 1; if (startOfs < 0) startOfs = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  
  const today = new Date(); today.setHours(0,0,0,0);
  const todayIso = isoLocal(today);
  
  // Collect events by date
  const eventsByDate = {};
  (DB.appointments || []).forEach(a => {
    if (a.budouciDate) {
      const d = parseDateIso(a.budouciDate);
      if (d && d.getFullYear() === year && d.getMonth() === month) {
        const k = a.budouciDate;
        eventsByDate[k] = eventsByDate[k] || { appts: [], calls: [] };
        eventsByDate[k].appts.push(a);
      }
    }
    if (a.terminVolaniDate) {
      const d = parseDateIso(a.terminVolaniDate);
      if (d && d.getFullYear() === year && d.getMonth() === month) {
        const k = a.terminVolaniDate;
        eventsByDate[k] = eventsByDate[k] || { appts: [], calls: [] };
        eventsByDate[k].calls.push(a);
      }
    }
  });
  
  // Build grid: 6 rows × 7 cols, fill empty slots before/after
  let cells = "";
  for (let i = 0; i < startOfs; i++) {
    cells += `<div class="cal-day empty"></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = iso === todayIso;
    const ev = eventsByDate[iso];
    const apptCount = ev ? ev.appts.length : 0;
    const callCount = ev ? ev.calls.length : 0;
    cells += `<div class="cal-day ${isToday ? 'today' : ''} ${ev ? 'has-event' : ''}" onclick="showDayDetail('${iso}')">
      <div class="cal-day-num">${d}</div>
      ${apptCount ? `<div class="cal-dots">${Array(Math.min(apptCount, 3)).fill('<span class="cal-dot appt"></span>').join('')}${apptCount > 3 ? `<span class="cal-more">+${apptCount-3}</span>` : ''}</div>` : ''}
      ${callCount ? `<div class="cal-dots">${Array(Math.min(callCount, 2)).fill('<span class="cal-dot call"></span>').join('')}</div>` : ''}
    </div>`;
  }
  
  // Day detail panel (if open)
  let detailPanel = "";
  if (openDayDetail) {
    const dd = parseDateIso(openDayDetail);
    const dayEvents = appointmentsForDate(openDayDetail);
    const dayLabel = dd ? dd.toLocaleDateString("cs-CZ", {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : openDayDetail;
    detailPanel = `
      <div class="card elev" style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="card-title" style="margin:0">${esc(dayLabel)}</div>
          <button class="icon-btn" onclick="openDayDetail=null; renderAll()">✕ Zavřít</button>
        </div>
        ${dayEvents.length ? dayEvents.map(a => {
          const idx = DB.appointments.indexOf(a);
          const isAppt = a.budouciDate === openDayDetail;
          const isCall = a.terminVolaniDate === openDayDetail;
          return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
            <div style="display:flex;justify-content:space-between;align-items:start;gap:12px">
              <div style="flex:1">
                ${isAppt ? '<span class="tag blue">📅 Kontrola</span>' : ''}
                ${isCall ? '<span class="tag yellow">📞 Volat</span>' : ''}
                <div style="margin-top:6px"><strong>${esc(a.ambulance)}</strong>${a.lekar ? ` · ${esc(a.lekar)}` : ''}</div>
                ${a.kde ? `<div style="font-size:12px;color:var(--ink-muted)">${esc(a.kde)}</div>` : ''}
                ${a.cas && isAppt ? `<div style="font-size:13px;margin-top:4px">⏰ ${esc(a.cas)}</div>` : ''}
                ${a.telefon ? `<div style="font-family:var(--mono);font-size:12px;margin-top:4px">📞 <a href="tel:${esc(a.telefon)}" style="color:var(--accent)">${esc(a.telefon)}</a></div>` : ''}
                ${a.email ? `<div style="font-family:var(--mono);font-size:11px"><a href="mailto:${esc(a.email)}" style="color:var(--accent)">${esc(a.email)}</a></div>` : ''}
                ${a.komentar ? `<div style="margin-top:6px;font-size:13px;color:var(--ink-soft);font-style:italic">${esc(a.komentar)}</div>` : ''}
              </div>
              <div>
                <button class="icon-btn" onclick="editAppt(${idx})">✎</button>
              </div>
            </div>
          </div>`;
        }).join('') : '<div class="empty" style="padding:24px">Žádné události</div>'}
        <button class="add-row" onclick="addApptForDate('${openDayDetail}')" style="margin-top:12px">+ Přidat událost na tento den</button>
      </div>
    `;
  }
  
  return `
    <div class="cal-wrap card elev">
      <div class="cal-header">
        <button class="cal-nav" onclick="calMonthShift(-1)">‹</button>
        <div class="cal-title">${monthNames[month]} ${year}</div>
        <button class="btn" style="font-size:11px;padding:5px 10px" onclick="calToday()">Dnes</button>
        <button class="cal-nav" onclick="calMonthShift(1)">›</button>
      </div>
      <div class="cal-grid">
        ${dayNames.map(d => `<div class="cal-dayname">${d}</div>`).join('')}
        ${cells}
      </div>
      <div style="display:flex;gap:18px;margin-top:14px;font-size:11px;color:var(--ink-muted)">
        <span><span class="cal-dot appt" style="display:inline-block"></span> Kontrola</span>
        <span><span class="cal-dot call" style="display:inline-block"></span> Termín volání</span>
        <span style="margin-left:auto">Klik na den pro detail</span>
      </div>
    </div>
    ${detailPanel}
  `;
}

function calMonthShift(delta) {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
  openDayDetail = null;
  renderAll();
}

function calToday() {
  const d = new Date();
  calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  openDayDetail = isoLocal(d);
  renderAll();
}

function showDayDetail(iso) {
  openDayDetail = (openDayDetail === iso) ? null : iso;
  renderAll();
}

// Roleta ambulancí: lékaři ze seznamu (Info → Lékaři) + ambulance z existujících kontrol + „Jiné (nový)“
const APPT_OTHER = "— Jiné (nový lékař / ambulance) —";
function apptAmbOptions(current) {
  const fromContacts = (DB.contacts || []).map(c => (c.specialty || "") + (c.name ? " · " + c.name : "")).filter(Boolean);
  const fromAppts = (DB.appointments || []).map(a => a.ambulance || "").filter(Boolean);
  const opts = [...new Set([...fromContacts, ...fromAppts])].sort((a, b) => a.localeCompare(b, "cs"));
  if (current && !opts.some(o => o === current || o.startsWith(current + " · "))) opts.unshift(current);
  return [...opts, APPT_OTHER];
}
// Po otevření modalu: výběr v roletě doplní lékaře/telefon/e-mail ze seznamu lékařů (jde ručně přepsat)
function bindApptAutofill() {
  setTimeout(() => {
    const sel = document.querySelector('#modalFields [data-key="ambSel"]');
    if (!sel) return;
    sel.addEventListener("change", () => {
      const v = sel.value;
      const setIfEmptyOrAuto = (key, val) => { const el = document.querySelector('#modalFields [data-key="' + key + '"]'); if (el && val) el.value = val; };
      if (v === APPT_OTHER) return;
      const name = v.includes(" · ") ? v.split(" · ").slice(1).join(" · ") : "";
      const c = (DB.contacts || []).find(x => x.name === name) || (DB.contacts || []).find(x => (x.specialty || "") === v);
      if (!c) return;
      const pe = contactPhoneEmail(c);
      setIfEmptyOrAuto("lekar", c.name);
      setIfEmptyOrAuto("telefon", pe.phone);
      setIfEmptyOrAuto("email", pe.email);
    });
  }, 80);
}
function apptFields(a, isoDate) {
  a = a || {};
  const cur = a.ambulance ? ((DB.contacts || []).some(c => (c.specialty || "") === a.ambulance && c.name === a.lekar) ? a.ambulance + " · " + a.lekar : a.ambulance) : "";
  return [
    { key: "ambSel", label: "Ambulance / odborník (vyber ze seznamu)", type: "select", options: apptAmbOptions(cur), value: cur || APPT_OTHER },
    { key: "ambulanceNew", label: "Nová ambulance / odbornost (jen při volbě „Jiné“)", value: "" },
    { key: "lekar", label: "Jméno lékaře (doplní se samo, jde přepsat)", value: a.lekar || "" },
    { key: "kde", label: "Kde (adresa, patro…)", value: a.kde || "" },
    { key: "budouciDate", label: "Datum kontroly", type: "date", value: a.budouciDate || isoDate || "" },
    { key: "cas", label: "Čas (HH:MM)", type: "time", value: a.cas || "" },
    { key: "terminVolaniDate", label: "Kdy volat / objednat (volitelné)", type: "date", value: a.terminVolaniDate || "" },
    { key: "frekvence", label: "Frekvence (volitelné, např. půlročně)", value: a.frekvence || "" },
    { key: "telefon", label: "Telefon", value: a.telefon || "" },
    { key: "email", label: "E-mail", value: a.email || "" },
    { key: "komentar", label: "Poznámka — co vzít s sebou, příprava (moč…), co řešit", type: "textarea", value: a.komentar || "" }
  ];
}
function applyAppt(a, data) {
  let ambulance, lekar = data.lekar || "";
  if (data.ambSel === APPT_OTHER) {
    ambulance = data.ambulanceNew || data.lekar || "(ambulance)";
    // nového lékaře přidat do seznamu (propíše se do roletky i telefonního seznamu)
    if ((data.ambulanceNew || lekar) && !(DB.contacts || []).some(c => (c.specialty || "") === ambulance && c.name === lekar)) {
      if (!DB.contacts) DB.contacts = [];
      DB.contacts.push({ name: lekar || ambulance, specialty: ambulance, role: "", phone: data.telefon || "", email: data.email || "", status: "aktivní" });
    }
  } else {
    ambulance = data.ambSel.includes(" · ") ? data.ambSel.split(" · ")[0] : data.ambSel;
    if (!lekar && data.ambSel.includes(" · ")) lekar = data.ambSel.split(" · ").slice(1).join(" · ");
  }
  const out = { ...a, ambulance, lekar, kde: data.kde, budouciDate: data.budouciDate, cas: data.cas, terminVolaniDate: data.terminVolaniDate, frekvence: data.frekvence, telefon: data.telefon, email: data.email, komentar: data.komentar };
  delete out.ambSel; delete out.ambulanceNew;
  return out;
}

function editAppt(i) {
  const a = DB.appointments[i];
  openModal("Upravit kontrolu", apptFields(a), data => { DB.appointments[i] = applyAppt(a, data); });
  bindApptAutofill();
}

function addAppt() { addApptForDate(""); }

function addApptForDate(isoDate) {
  openModal("Nová kontrola", apptFields({}, isoDate), data => {
    DB.appointments.push(applyAppt({}, data));
    if (isoDate) openDayDetail = isoDate;
  });
  bindApptAutofill();
}

  const doctors = [...new Set(DB.questions.map(q => q.doctor))];
  openModal("Nová otázka", [
    { key: "doctor", label: "Pro koho", type: "select", options: doctors, value: doctors[0] },
    { key: "q", label: "Otázka", type: "textarea", value: "" }
  ], data => { DB.questions.push(data); });
}
function copyQuestions() {
  const filtered = qFilter === "all" ? DB.questions : DB.questions.filter(q => q.doctor === qFilter);
  const groups = {};
  filtered.forEach(q => { (groups[q.doctor] = groups[q.doctor] || []).push(q.q); });
  const text = Object.entries(groups).map(([doc, qs]) => `=== ${doc} ===\n${qs.map(q => "• " + q).join("\n")}`).join("\n\n");
  navigator.clipboard.writeText(text).then(() => alert("Zkopírováno do schránky."));
}

// ============================================================
// PAGE: EXERCISE — Tracker s heatmap mřížkou
// ============================================================

let exerciseDetailDate = null; // ISO date string
let exerciseTrendType = null;  // jméno cviku zobrazeného v grafu trendu

const DEFAULT_EXERCISE_TYPES = [
  { name: "Vis", unit: "sekundy" },
  { name: "Dřepy", unit: "opakování" },
  { name: "Protažení", unit: "minuty" }
];
const EXERCISE_UNITS = ["opakování", "sekundy", "minuty", "ano/ne", "jiné"];

function getExerciseTypes() {
  return (DB.exerciseTypes && DB.exerciseTypes.length) ? DB.exerciseTypes : DEFAULT_EXERCISE_TYPES;
}
function ensureExerciseTypes() {
  if (!DB.exerciseTypes || !DB.exerciseTypes.length) DB.exerciseTypes = DEFAULT_EXERCISE_TYPES.map(t => ({ ...t }));
}
// Položky dne — nový formát (items[]) i zpětně starý (pevná pole)
function entryItems(e) {
  if (!e) return [];
  if (Array.isArray(e.items)) return e.items;
  const items = [];
  if (e.visOpak != null) items.push({ name: "Vis – opakování", unit: "opakování", value: e.visOpak });
  if (e.visVydrz != null) items.push({ name: "Vis – výdrž", unit: "sekundy", value: e.visVydrz });
  if (e.ausRowOpak != null) items.push({ name: "Australian row", unit: "opakování", value: e.ausRowOpak });
  if (e.lezeniTamZpet != null) items.push({ name: "Lezení", unit: "opakování", value: e.lezeniTamZpet });
  if (e.trampolinaMin != null) items.push({ name: "Trampolína", unit: "minuty", value: e.trampolinaMin });
  if (e.plavani === "Y") items.push({ name: "Plavání", unit: "ano/ne", value: "ano" });
  return items;
}
function dayDidExercise(e) { return !!(e && (e.cvicil === "Y" || entryItems(e).length > 0)); }
function unitShort(u) { return u === "opakování" ? "×" : u === "sekundy" ? "s" : u === "minuty" ? "min" : ""; }

let exerciseTab = "cvik"; // cvik | akt

function renderExercise() {
  if (exerciseTab === "akt") return renderActivities();
  return renderExerciseTracker();
}

function exerciseTabsHtml() {
  return `<div class="subtabs" style="margin-bottom:4px">
    <button class="filter-btn ${exerciseTab === "cvik" ? "active" : ""}" onclick="exerciseTab='cvik'; renderAll()">💪 Cvičení</button>
    <button class="filter-btn ${exerciseTab === "akt" ? "active" : ""}" onclick="exerciseTab='akt'; renderAll()">🚶 Aktivity a km</button>
  </div>`;
}

function renderExerciseTracker() {
  const log = DB.exerciseLog || [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = 90; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const iso = isoLocal(d);
    const entry = log.find(e => e.date === iso);
    const n = entry ? entryItems(entry).length : 0;
    let intensity = 0;
    if (dayDidExercise(entry)) intensity = n >= 3 ? 4 : n === 2 ? 3 : n === 1 ? 2 : 1;
    days.push({ date: d, iso, entry, intensity });
  }
  const c7 = days.slice(-7).filter(d => dayDidExercise(d.entry)).length;
  const c30 = days.slice(-30).filter(d => dayDidExercise(d.entry)).length;
  let streak = 0;
  for (let i = days.length - 1; i >= 0; i--) { if (dayDidExercise(days[i].entry)) streak++; else break; }

  const types = getExerciseTypes();
  const metrics = exerciseMetrics(log).map(m => Object.assign({}, m, { days: exerciseDailyPoints(log, m.name, m.unit).length }));
  // default = metrika s nejvíc dny dat (ať se rovnou vykreslí graf), pak abecedně
  const metricsByData = metrics.slice().sort((a, b) => b.days - a.days || (a.name + a.unit).localeCompare(b.name + b.unit, "cs"));
  const metricSel = (exerciseTrendType && metrics.some(m => m.key === exerciseTrendType)) ? exerciseTrendType : (metricsByData[0] && metricsByData[0].key) || "";
  const selMetric = metrics.find(m => m.key === metricSel);

  const detailPanel = renderExerciseDayDetail(exerciseDetailDate || isoLocal(), log);

  return exerciseTabsHtml() + `
    <div class="page-header">
      <div>
        <div class="page-title">Cvičení – tracker</div>
        <div class="page-subtitle">${log.length} záznamů · ${types.length} typů cviků</div>
      </div>
      <div class="page-actions">
        <button class="btn primary" onclick="addExerciseToday()">+ Záznam pro dnešek</button>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="tile-label">Cvičil za 7 dní</div><div class="tile-value green">${c7}</div><div class="tile-sub">ze 7</div></div>
      <div class="tile"><div class="tile-label">Cvičil za 30 dní</div><div class="tile-value ${c30 >= 21 ? "green" : c30 >= 12 ? "yellow" : "red"}">${c30}</div><div class="tile-sub">z 30 (${Math.round(c30 / 30 * 100)}%)</div></div>
      <div class="tile"><div class="tile-label">Streak (po sobě)</div><div class="tile-value ${streak >= 3 ? "green" : ""}">${streak} <span style="font-size:14px;color:var(--ink-muted)">dnů</span></div><div class="tile-sub">do dnes</div></div>
      <div class="tile"><div class="tile-label">Záznamů celkem</div><div class="tile-value">${log.length}</div><div class="tile-sub">v trackeru</div></div>
    </div>

    ${detailPanel}

    <div class="section">
      <div class="section-title">🏋️ Moje cviky <div class="section-title-line"></div></div>
      <div class="card elev">
        <div class="ex-types">
          ${types.map((t, i) => `<div class="peek-row" style="cursor:default">
            <span class="peek-title">${esc(t.name)}</span>
            <span class="peek-meta">${esc(t.unit)}</span>
            <button class="icon-btn" onclick="editExerciseType(${i})">✎</button>
            <button class="icon-btn" onclick="deleteExerciseType(${i})">✕</button>
          </div>`).join("")}
        </div>
        <button class="btn primary" style="margin-top:12px" onclick="addExerciseType()">+ Přidat cvik</button>
        ${(!DB.exerciseTypes || !DB.exerciseTypes.length) ? `<div style="font-size:11px;color:var(--ink-muted);margin-top:8px">Toto jsou výchozí cviky — přejmenuj je nebo přidej vlastní.</div>` : ""}
      </div>
    </div>

    <div class="section">
      <div class="section-title">📈 Progres metriky <div class="section-title-line"></div></div>
      <div class="card elev">
        ${metrics.length ? `
        <div style="margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--ink-muted)">Metrika:</span>
          <select onchange="exerciseTrendType=this.value; renderAll()" style="padding:6px 10px">
            ${metrics.map(m => `<option value="${esc(m.key)}" ${m.key === metricSel ? "selected" : ""}>${esc(m.name)} · ${esc(m.unit)} (${m.days} ${m.days === 1 ? "den" : "dnů"})</option>`).join("")}
          </select>
        </div>
        <div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px">Po dnech (osa Y = ${esc(selMetric ? selMetric.unit : "")}, osa X = datum)</div>
        ${exLineChart(exerciseDailyPoints(log, selMetric.name, selMetric.unit), selMetric.unit, { xTitle: "datum", empty: "Tato metrika má zatím " + selMetric.days + (selMetric.days === 1 ? " den" : " dny/dnů") + " — pro graf jsou potřeba aspoň 2 dny. Vyber jinou metriku nebo přidej další den." })}
        ` : `<div class="empty" style="padding:20px">Zatím žádná číselná metrika. Přidej cvik s hodnotou (sekundy / opakování…).</div>`}
      </div>
    </div>

    ${metrics.length ? `
    <div class="section">
      <div class="section-title">🗓️ Týdenní vyhodnocení <div class="section-title-line"></div></div>
      <div class="card elev">
        ${(() => {
          const wpts = exerciseWeeklyPoints(log, selMetric.name, selMetric.unit);
          const last = wpts[wpts.length - 1], prev = wpts[wpts.length - 2];
          let cmp = "";
          if (last && prev) {
            const diff = last.y - prev.y; const pct = prev.y ? Math.round(diff / prev.y * 100) : 0;
            const col = diff > 0 ? "var(--green)" : diff < 0 ? "var(--red)" : "var(--ink-muted)";
            cmp = `<div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px">
              <div><div class="tile-label">Tento týden</div><div style="font-size:22px;font-weight:700">${fmtNum(last.y)} ${esc(selMetric.unit)}</div><div class="tile-sub">${last.days} dnů · od ${esc(weekLabelCz(last.x))}</div></div>
              <div><div class="tile-label">Minulý týden</div><div style="font-size:22px;font-weight:700">${fmtNum(prev.y)} ${esc(selMetric.unit)}</div><div class="tile-sub">${prev.days} dnů · od ${esc(weekLabelCz(prev.x))}</div></div>
              <div><div class="tile-label">Změna</div><div style="font-size:22px;font-weight:700;color:${col}">${diff > 0 ? "+" : ""}${fmtNum(diff)} ${esc(selMetric.unit)}</div><div class="tile-sub" style="color:${col}">${diff > 0 ? "+" : ""}${pct} % vs minulý týden</div></div>
            </div>`;
          } else if (last) {
            cmp = `<div style="margin-bottom:14px"><div class="tile-label">Tento týden</div><div style="font-size:22px;font-weight:700">${fmtNum(last.y)} ${esc(selMetric.unit)}</div><div class="tile-sub">${last.days} dnů · zatím není s čím srovnat</div></div>`;
          }
          return cmp + `<div style="font-size:12px;color:var(--ink-muted);margin-bottom:6px">Součet po týdnech (osa Y = ${esc(selMetric.unit)}, osa X = týden od pondělí)</div>` +
            exLineChart(wpts, selMetric.unit, { xTitle: "týden (od pondělí)", xfmt: weekLabelCz, point: p => "týden od " + weekLabelCz(p.x) + ": " + fmtNum(p.y) + " " + selMetric.unit + " (" + p.days + " dnů)", empty: "Pro týdenní srovnání jsou potřeba aspoň 2 týdny se záznamem." });
        })()}
      </div>
    </div>` : ""}

    <div class="section">
      <div class="section-title">📋 Posledních 20 dní <div class="section-title-line"></div></div>
      <div class="card" style="padding:6px">
        ${log.length ? log.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20).map(e => {
          const i = log.indexOf(e);
          const items = entryItems(e);
          const summary = items.length
            ? items.map(it => `${esc(it.name)} ${esc(String(it.value))}${unitShort(it.unit) ? " " + unitShort(it.unit) : ""}`).join(" · ")
            : (dayDidExercise(e) ? "cvičil" : "necvičil");
          const durTag = e.durationMin ? " · ⏱ " + e.durationMin + " min" : "";
          return `<div class="peek-row" onclick="exerciseDetailDate='${e.date}'; renderAll()">
            <span class="peek-dot" style="background:${dayDidExercise(e) ? "var(--green)" : "var(--ink-muted)"}"></span>
            <span class="peek-title">${esc(e.date)} — ${summary}${durTag}</span>
            <button class="icon-btn" onclick="event.stopPropagation(); deleteRow('exerciseLog', ${i}, 'záznam')">✕</button>
          </div>`;
        }).join("") : `<div class="empty" style="padding:16px">Zatím žádné záznamy.</div>`}
      </div>
    </div>
  `;
}

  const entry = log.find(e => e.date === iso);
  const d = parseDateIso(iso);
  const dayLabel = d ? d.toLocaleDateString("cs-CZ", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : iso;
  const items = entryItems(entry);
  const types = getExerciseTypes();
  return `
    <div class="card elev" id="exDayPanel" style="margin-top:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <label class="ex-lbl" style="margin:0">Den záznamu</label>
          <input type="date" value="${esc(iso)}" max="${esc(isoLocal())}" onchange="exerciseDetailDate=this.value; renderAll()" style="padding:7px 10px">
          <span style="font-size:12.5px;color:var(--ink-soft)">${esc(dayLabel)}</span>
        </div>
        <button class="btn" onclick="exerciseDetailDate=isoLocal(); renderAll()">Dnes</button>

          <span class="peek-meta">${esc(String(it.value))} ${esc(it.unit || "")}</span>

      <div style="display:flex;gap:8px;align-items:flex-end;margin-top:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px">

          <select id="exAddType" onchange="exSyncUnit()" style="width:100%;padding:8px 10px">${types.map(t => `<option value="${esc(t.name)}" data-unit="${esc(t.unit)}">${esc(t.name)}</option>`).join("")}</select>
        </div>
        <div style="width:130px">
          <label class="ex-lbl">Metrika</label>
          <select id="exAddUnit" style="width:100%;padding:8px 10px">${EXERCISE_UNITS.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join("")}</select>
        </div>
        <div style="width:120px">
          <label class="ex-lbl">Hodnota</label>
          <input id="exAddValue" type="text" placeholder="počet / s / min" style="width:100%;padding:8px 10px">
        </div>
        <button class="btn primary" onclick="addExerciseItem('${iso}')">+ Přidat</button>
      </div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:6px">Tip: u jednoho cviku přidej víc metrik zvlášť — třeba „Vis na hrazdě · sekundy = 35" a pak „Vis na hrazdě · opakování = 8".</div>

      <div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--ink-muted)">Rychle přidat:</span>
        <div class="chipline">${types.map((t, ti) => `<button type="button" class="chip" onclick="quickAddExercise('${iso}', ${ti})">+ ${esc(t.name)}</button>`).join("")}</div>
      </div>

      <div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--ink-muted)">Celkem cvičeno:</span>
        <input type="number" min="0" step="1" value="${entry && entry.durationMin ? esc(String(entry.durationMin)) : ""}" placeholder="min" style="width:80px;padding:7px 10px" onchange="setExerciseDuration('${iso}', this.value)"> <span style="font-size:12px;color:var(--ink-muted)">minut</span>
        <span style="flex:1"></span>
        <button class="btn" onclick="copyExerciseDay('${iso}')">⧉ Kopírovat jiný den</button>
        ${items.length ? `<button class="btn" onclick="saveExerciseTemplate('${iso}')">☆ Uložit jako šablonu</button>` : ""}
      </div>
      ${(DB.exerciseTemplates || []).length ? `<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--ink-muted)">Šablony:</span>
        <div class="chipline">${DB.exerciseTemplates.map((tp, ti) => `<span class="chip-group"><button type="button" class="chip" title="Vložit šablonu do dne" onclick="applyExerciseTemplate('${iso}', ${ti})">▸ ${esc(tp.name)}</button><button type="button" class="chip chip-x" title="Smazat šablonu" onclick="deleteExerciseTemplate(${ti})">✕</button></span>`).join("")}</div>
      </div>` : ""}

      <div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;color:var(--ink-muted)">Tento den:</span>

        <button class="filter-btn ${entry && entry.cvicil === "N" && !items.length ? "active" : ""}" onclick="setExerciseCvicil('${iso}','N')">Necvičil</button>
        <button class="btn" onclick="editExerciseNote('${iso}')" style="margin-left:auto">✎ Poznámka</button>
      </div>
      ${entry && entry.poznamka ? `<div style="margin-top:10px;font-style:italic;color:var(--ink-soft);font-size:12.5px">${esc(entry.poznamka)}</div>` : ""}

function exerciseEntryFor(iso, createIfMissing) {
  if (!DB.exerciseLog) DB.exerciseLog = [];
  let entry = DB.exerciseLog.find(e => e.date === iso);
  if (!entry && createIfMissing) { entry = { date: iso, cvicil: "N", items: [], poznamka: "" }; DB.exerciseLog.push(entry); }
  if (entry && !Array.isArray(entry.items)) entry.items = entryItems(entry); // migrace starého formátu při zápisu
  return entry;
}
function exSyncUnit() {
  const sel = document.getElementById("exAddType"); const us = document.getElementById("exAddUnit");
  if (!sel || !us) return;
  const u = sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].getAttribute("data-unit");
  if (u) us.value = u;
}
function addExerciseItem(iso) {
  const sel = document.getElementById("exAddType");
  const valEl = document.getElementById("exAddValue");
  const unitEl = document.getElementById("exAddUnit");
  if (!sel || !valEl) return;
  const name = sel.value;
  const value = valEl.value.trim();
  if (!name || value === "") return;
  const type = getExerciseTypes().find(t => t.name === name) || { unit: "" };
  const unit = (unitEl && unitEl.value) || type.unit || "";
  const entry = exerciseEntryFor(iso, true);
  entry.items.push({ name, unit, value });
  entry.cvicil = "Y";
  save(); renderAll();
}
function deleteExerciseItem(iso, ix) {
  const entry = exerciseEntryFor(iso, false);
  if (!entry) return;
  entry.items.splice(ix, 1);
  save(); renderAll();
}
function setExerciseCvicil(iso, yn) {
  const entry = exerciseEntryFor(iso, true);
  entry.cvicil = yn;
  save(); renderAll();
}
function editExerciseNote(iso) {
  const cur = (DB.exerciseLog || []).find(e => e.date === iso);
  openModal("Poznámka", [{ key: "poznamka", label: "Poznámka", type: "textarea", value: cur ? (cur.poznamka || "") : "" }], data => {
    const entry = exerciseEntryFor(iso, true);
    entry.poznamka = data.poznamka;
    exerciseDetailDate = iso;
  });
}

function quickAddExercise(iso, ti) {
  const type = getExerciseTypes()[ti];
  if (!type) return;
  const entry = exerciseEntryFor(iso, true);
  entry.items.push({ name: type.name, unit: type.unit || "", value: "✓" });
  entry.cvicil = "Y";
  save(); renderAll();
}

function setExerciseDuration(iso, v) {
  const entry = exerciseEntryFor(iso, true);
  const n = parseInt(v, 10);
  entry.durationMin = isNaN(n) || n <= 0 ? 0 : n;
  if (entry.durationMin > 0) entry.cvicil = "Y";
  save(); renderAll();
}

function copyExerciseDay(iso) {
  const log = (DB.exerciseLog || []).filter(e => e.date !== iso && entryItems(e).length).sort((a, b) => b.date.localeCompare(a.date));
  if (!log.length) { alert("Není odkud kopírovat — žádný jiný den nemá záznam."); return; }
  const opts = log.slice(0, 30).map(e => e.date + " — " + entryItems(e).map(it => it.name).join(", ").slice(0, 60));
  openModal("Kopírovat cviky z jiného dne", [
    { key: "src", label: "Vyber den (posledních 30 se záznamem)", type: "select", options: opts, value: opts[0] }
  ], data => {
    const srcDate = (data.src || "").slice(0, 10);
    const srcEntry = (DB.exerciseLog || []).find(e => e.date === srcDate);
    if (!srcEntry) return;
    const entry = exerciseEntryFor(iso, true);
    entryItems(srcEntry).forEach(it => entry.items.push({ name: it.name, unit: it.unit, value: it.value }));
    if (srcEntry.durationMin && !entry.durationMin) entry.durationMin = srcEntry.durationMin;
    entry.cvicil = "Y";
    exerciseDetailDate = iso;
  });
}

function saveExerciseTemplate(iso) {
  const entry = (DB.exerciseLog || []).find(e => e.date === iso);
  if (!entry || !entryItems(entry).length) return;
  openModal("Uložit jako šablonu", [
    { key: "name", label: "Název šablony (např. Pondělní sestava)", value: "" }
  ], data => {
    if (!data.name) return;
    if (!Array.isArray(DB.exerciseTemplates)) DB.exerciseTemplates = [];
    DB.exerciseTemplates.push({ name: data.name, items: entryItems(entry).map(it => ({ name: it.name, unit: it.unit, value: it.value })), durationMin: entry.durationMin || 0 });
  });
}

function applyExerciseTemplate(iso, ti) {
  const tp = (DB.exerciseTemplates || [])[ti];
  if (!tp) return;
  const entry = exerciseEntryFor(iso, true);
  (tp.items || []).forEach(it => entry.items.push({ name: it.name, unit: it.unit, value: it.value }));
  if (tp.durationMin && !entry.durationMin) entry.durationMin = tp.durationMin;
  entry.cvicil = "Y";
  save(); renderAll();
}

function deleteExerciseTemplate(ti) {
  const tp = (DB.exerciseTemplates || [])[ti];
  if (tp && confirm("Smazat šablonu „" + tp.name + "“?")) { DB.exerciseTemplates.splice(ti, 1); save(); renderAll(); }
}

const ACTIVITY_TYPES = ["Pěšky ze školy", "Procházka", "Výlet", "Kolo", "Koloběžka", "Plavání", "Jiné"];

function activitiesList() { if (!Array.isArray(DB.activities)) DB.activities = []; return DB.activities; }

function actMonthKey(iso) { return String(iso || "").slice(0, 7); }

function actMonthlyStats() {
  const byM = {};
  activitiesList().forEach(a => {
    const m = actMonthKey(a.date); if (!m) return;
    if (!byM[m]) byM[m] = { km: 0, min: 0, n: 0 };
    byM[m].km += (+a.km || 0); byM[m].min += (+a.minutes || 0); byM[m].n++;
  });
  return byM;
}

function actBarChart(byM) {
  const keys = Object.keys(byM).sort();
  if (keys.length < 1) return `<div class="empty" style="padding:20px">Zatím žádná data pro graf.</div>`;
  const last12 = keys.slice(-12);
  const W = 640, H = 220, padL = 44, padR = 10, padT = 14, padB = 40;
  const maxY = Math.max(...last12.map(k => byM[k].km), 1);
  const bw = (W - padL - padR) / last12.length;
  const py = v => H - padB - (v / maxY) * (H - padT - padB);
  const bars = last12.map((k, i) => {
    const v = byM[k].km;
    const x = padL + i * bw + bw * 0.14;
    const lab = MONTHS_SH[+k.slice(5, 7) - 1] + " " + k.slice(2, 4);
    return `<rect x="${x.toFixed(1)}" y="${py(v).toFixed(1)}" width="${(bw * 0.72).toFixed(1)}" height="${(H - padB - py(v)).toFixed(1)}" rx="3" fill="var(--green)" opacity="0.85"><title>${esc(lab)}: ${v.toFixed(1)} km (${byM[k].n} aktivit)</title></rect>
      <text x="${(x + bw * 0.36).toFixed(1)}" y="${H - padB + 14}" font-size="9" text-anchor="middle" fill="var(--ink-muted)">${esc(lab)}</text>
      ${v ? `<text x="${(x + bw * 0.36).toFixed(1)}" y="${(py(v) - 4).toFixed(1)}" font-size="9" text-anchor="middle" fill="var(--ink-soft)">${v % 1 ? v.toFixed(1) : v}</text>` : ""}`;
  }).join("");
  const ticks = [0, 0.5, 1].map(f => maxY * f);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:220px" font-family="JetBrains Mono">
    ${ticks.map(y => `<line x1="${padL}" y1="${py(y).toFixed(1)}" x2="${W - padR}" y2="${py(y).toFixed(1)}" stroke="var(--line)"/><text x="${padL - 6}" y="${(py(y) + 3).toFixed(1)}" font-size="9" text-anchor="end" fill="var(--ink-muted)">${(+y.toFixed(1))}</text>`).join("")}
    ${bars}
    <text x="12" y="${((padT + H - padB) / 2).toFixed(0)}" font-size="10" text-anchor="middle" fill="var(--ink-soft)" transform="rotate(-90 12 ${((padT + H - padB) / 2).toFixed(0)})">km / měsíc</text>
  </svg>`;
}
