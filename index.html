function renderExerciseHeatmap(days) {
  // Build columns of 7 days each (mon-sun), align so today is in last column
  // Pad start to begin on Monday
  const firstDay = days[0].date;
  let firstWeekday = firstDay.getDay() - 1; if (firstWeekday < 0) firstWeekday = 6;
  
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null); // empty padding
  cells.push(...days);
  
  // Group into columns
  const cols = [];
  for (let i = 0; i < cells.length; i += 7) {
    cols.push(cells.slice(i, i+7));
  }
  
  const dayLabels = ["Po","","St","","Pá","",""];
  
  let html = `<div class="heatmap"><div class="heatmap-row-labels">${dayLabels.map(l => `<div class="hm-row-lbl">${l}</div>`).join('')}</div><div class="heatmap-cols">`;
  for (const col of cols) {
    html += `<div class="heatmap-col">`;
    for (const cell of col) {
      if (!cell) {
        html += `<div class="hm-cell hm-empty"></div>`;
      } else {
        const entry = cell.entry;
        const dateStr = cell.date.toLocaleDateString("cs-CZ", {day:'numeric', month:'numeric'});
        const tooltip = entry 
          ? `${dateStr}: ${entry.cvicil === "Y" ? "✓ cvičil" : "✗ necvičil"}${entry.poznamka ? ' · ' + entry.poznamka : ''}`
          : `${dateStr}: bez záznamu`;
        html += `<div class="hm-cell hm-${cell.intensity}" title="${esc(tooltip)}" onclick="exerciseDetailDate='${cell.iso}'; renderAll()"></div>`;
      }
    }
    html += `</div>`;
  }
  html += `</div></div>`;
  return html;
}

// Seznam metrik přítomných v logu (cvik · jednotka) s číselnou hodnotou
function exerciseMetrics(log) {
  const seen = new Map();
  (log || []).forEach(e => entryItems(e).forEach(it => {
    if (numCZ(it.value) != null) {
      const key = (it.name || "") + "||" + (it.unit || "");
      if (!seen.has(key)) seen.set(key, { key, name: it.name || "", unit: it.unit || "" });
    }
  }));
  return [...seen.values()].sort((a, b) => (a.name + a.unit).localeCompare(b.name + b.unit, "cs"));
}
// Denní součty metriky (víc zápisů téhož dne se sečte)
function exerciseDailyPoints(log, name, unit) {
  const byDay = {};
  (log || []).forEach(e => entryItems(e).forEach(it => {
    if (it.name === name && (it.unit || "") === unit) { const v = numCZ(it.value); if (v != null) byDay[e.date] = (byDay[e.date] || 0) + v; }
  }));
  return Object.keys(byDay).sort().map(d => ({ x: d, y: byDay[d] }));
}
// Týdenní součty metriky (klíč = pondělí týdne)
function exerciseWeeklyPoints(log, name, unit) {
  const byWeek = {};
  (log || []).forEach(e => {
    const d = parseDateIso(e.date); if (!d) return; const wk = isoLocal(mondayOf(d));
    entryItems(e).forEach(it => { if (it.name === name && (it.unit || "") === unit) { const v = numCZ(it.value); if (v != null) { byWeek[wk] = byWeek[wk] || { sum: 0, days: {} }; byWeek[wk].sum += v; byWeek[wk].days[e.date] = 1; } } });
  });
  return Object.keys(byWeek).sort().map(wk => ({ x: wk, y: byWeek[wk].sum, days: Object.keys(byWeek[wk].days).length }));
}
// Spojnicový graf s popsanými osami (X i Y), tooltip na bodech
function exLineChart(pts, unit, opts) {
  opts = opts || {};
  if (!pts || pts.length < 2) return `<div class="empty" style="padding:20px">${esc(opts.empty || "Pro graf jsou potřeba aspoň 2 body s číselnou hodnotou.")}</div>`;
  const W = 640, H = 250, padL = 56, padR = 18, padT = 18, padB = 50;
  const maxY = Math.max(...pts.map(p => p.y), 1), minY = 0, n = pts.length;
  const px = i => padL + (i / Math.max(n - 1, 1)) * (W - padL - padR);
  const py = v => H - padB - ((v - minY) / (maxY - minY || 1)) * (H - padT - padB);
  const path = pts.map((p, i) => `${i ? "L" : "M"} ${px(i).toFixed(1)} ${py(p.y).toFixed(1)}`).join(" ");
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => maxY * f);
  const dec = maxY < 10 ? 1 : 0;
  const xIdx = [...new Set([0, Math.floor((n - 1) / 3), Math.floor(2 * (n - 1) / 3), n - 1])];
  const xfmt = opts.xfmt || (x => x);
  const ptTip = opts.point || (p => p.x + ": " + p.y + " " + (unit || ""));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:250px" font-family="JetBrains Mono">
    ${ticks.map(y => `<line x1="${padL}" y1="${py(y).toFixed(1)}" x2="${W - padR}" y2="${py(y).toFixed(1)}" stroke="var(--line)"/><text x="${padL - 7}" y="${(py(y) + 3).toFixed(1)}" font-size="9" text-anchor="end" fill="var(--ink-muted)">${(+y.toFixed(dec))}</text>`).join("")}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--line)"/>
    <path d="${path}" fill="none" stroke="var(--green)" stroke-width="2"/>
    ${pts.map((p, i) => `<circle cx="${px(i).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="3.5" fill="var(--green)"><title>${esc(ptTip(p))}</title></circle>`).join("")}
    ${xIdx.map(i => `<text x="${px(i).toFixed(1)}" y="${H - padB + 16}" font-size="9" text-anchor="middle" fill="var(--ink-muted)">${esc(xfmt(pts[i].x))}</text>`).join("")}
    <text x="${((padL + W - padR) / 2).toFixed(0)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--ink-soft)">${esc(opts.xTitle || "datum")}</text>
    <text x="13" y="${((padT + H - padB) / 2).toFixed(0)}" font-size="10" text-anchor="middle" fill="var(--ink-soft)" transform="rotate(-90 13 ${((padT + H - padB) / 2).toFixed(0)})">${esc(unit || "hodnota")}</text>
  </svg>`;
}
function weekLabelCz(iso) { const d = parseDateIso(iso); return d ? (d.getDate() + "." + (d.getMonth() + 1) + ".") : iso; }

function renderExerciseTrend(log, typeName) {
  if (!typeName) return '<div class="empty" style="padding:20px">Vyber cvik výše a uvidíš jeho vývoj v čase.</div>';
  const pts = [];
  log.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(e => {
    const it = entryItems(e).find(x => x.name === typeName);
    if (it) { const v = numCZ(it.value); if (v != null) pts.push({ x: e.date, y: v }); }
  });
  if (pts.length < 2) return '<div class="empty" style="padding:20px">Pro graf jsou potřeba aspoň 2 záznamy tohoto cviku s číselnou hodnotou.</div>';
  const W = 600, H = 200, padL = 40, padR = 20, padT = 20, padB = 30;
  const maxY = Math.max(...pts.map(p => p.y), 1), minY = 0;
  const dates = pts.map(p => p.x);
  const px = (date) => padL + (dates.indexOf(date) / Math.max(dates.length - 1, 1)) * (W - padL - padR);
  const py = (v) => H - padB - ((v - minY) / (maxY - minY)) * (H - padT - padB);
  const path = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${px(p.x).toFixed(1)} ${py(p.y).toFixed(1)}`).join(" ");
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:200px">
      ${[0, maxY * 0.25, maxY * 0.5, maxY * 0.75, maxY].map(y => `
        <line x1="${padL}" y1="${py(y)}" x2="${W - padR}" y2="${py(y)}" stroke="var(--line)" stroke-width="1"/>
        <text x="${padL - 6}" y="${py(y) + 3}" font-size="9" text-anchor="end" fill="var(--ink-muted)" font-family="JetBrains Mono">${y.toFixed(0)}</text>`).join("")}
      <path d="${path}" fill="none" stroke="var(--green)" stroke-width="2"/>
      ${pts.map(p => `<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="3" fill="var(--green)"/>`).join("")}
      ${[0, Math.floor(dates.length / 2), dates.length - 1].map(i => `<text x="${px(dates[i])}" y="${H - 12}" font-size="9" text-anchor="middle" fill="var(--ink-muted)" font-family="JetBrains Mono">${esc(dates[i])}</text>`).join("")}
    </svg>`;
}

// ============================================================
// PAGE: GROWTH — Tabbed view: Trend + WHO percentily
// ============================================================

let growthTab = "trend"; // 'trend' | 'percentile'
let growthMetric = "height"; // 'height' | 'weight' | 'bmi'

function renderGrowth() {
  const ms = (DB.measurements || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  
  // Compute monthly growth, BMI, WHO percentile for last measurement
  const last = ms[ms.length - 1];
  let lastBmi = "—";
  let lastPercentile = "—";
  if (last) {
    if (last.height && last.weight) {
      const h = last.height / 100;
      lastBmi = (last.weight / (h*h)).toFixed(1);
    } else if (last.bmi) {
      lastBmi = last.bmi.toFixed(1);
    }
    if (last.height) {
      const months = ageInMonths(last.date);
      if (months != null) lastPercentile = whoPercentile("height", months, last.height);
    }
  }
  
  return `
    <div class="page-header">
      <div>
        <div class="page-title">Růst a měření</div>
        <div class="page-subtitle">${ms.length} měření · měsíční granularita</div>
      </div>
      <div class="page-actions">
        <button class="btn primary" onclick="addMeasurement()">+ Nové měření</button>
      </div>
    </div>
    
    <div class="tiles">
      <div class="tile"><div class="tile-label">Aktuální výška</div><div class="tile-value">${last && last.height ? last.height.toFixed(1) : "—"} <span style="font-size:14px;color:var(--ink-muted)">cm</span></div><div class="tile-sub">${last ? last.date : "—"}</div></div>
      <div class="tile"><div class="tile-label">Aktuální váha</div><div class="tile-value">${last && last.weight ? last.weight.toFixed(2) : "—"} <span style="font-size:14px;color:var(--ink-muted)">kg</span></div><div class="tile-sub">${last ? last.date : "—"}</div></div>
      <div class="tile"><div class="tile-label">BMI</div><div class="tile-value">${lastBmi}</div><div class="tile-sub">${last ? last.date : "—"}</div></div>
      <div class="tile"><div class="tile-label">Percentil výšky</div><div class="tile-value">${lastPercentile}</div><div class="tile-sub">WHO chlapci</div></div>
    </div>
    
    <div class="filters">
      <button class="filter-btn ${growthTab === 'trend' ? 'active' : ''}" onclick="growthTab='trend'; renderAll()">📈 Trend v čase</button>
      <button class="filter-btn ${growthTab === 'percentile' ? 'active' : ''}" onclick="growthTab='percentile'; renderAll()">📊 WHO percentily</button>
      <span style="margin-left:auto;font-size:11px;color:var(--ink-muted);align-self:center">Metrika:</span>
      <button class="filter-btn ${growthMetric === 'height' ? 'active' : ''}" onclick="growthMetric='height'; renderAll()">Výška</button>
      <button class="filter-btn ${growthMetric === 'weight' ? 'active' : ''}" onclick="growthMetric='weight'; renderAll()">Váha</button>
      <button class="filter-btn ${growthMetric === 'bmi' ? 'active' : ''}" onclick="growthMetric='bmi'; renderAll()">BMI</button>
    </div>
    
    <div class="section">
      <div class="card elev">
        ${growthTab === 'trend' ? renderGrowthTrendChart(ms, growthMetric) : renderWHOPercentileChart(ms, growthMetric)}
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">📋 Tabulka měření <div class="section-title-line"></div></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Datum</th><th>Výška (cm)</th><th>Trend</th><th>Váha (kg)</th><th>Trend</th><th>BMI</th><th>Roční nárůst v/v</th><th>Poznámka</th><th></th></tr></thead>
        <tbody>
          ${[...ms].reverse().map((r, idx) => {
            const i = DB.measurements.indexOf(r);
            const prevIdx = ms.indexOf(r) - 1;
            const prev = prevIdx >= 0 ? ms[prevIdx] : null;
            let trendH = "—", trendW = "—";
            if (prev) {
              if (r.height && prev.height) {
                const dh = r.height - prev.height;
                trendH = dh > 0 ? `▲ +${dh.toFixed(1)}` : dh < 0 ? `▼ ${dh.toFixed(1)}` : "→ stejné";
              }
              if (r.weight && prev.weight) {
                const dw = r.weight - prev.weight;
                trendW = dw > 0 ? `▲ +${dw.toFixed(2)}` : dw < 0 ? `▼ ${dw.toFixed(2)}` : "→ stejné";

            // Year-over-year
            const yearAgo = ms.find(m => {
              const d1 = parseDateIso(m.date), d2 = parseDateIso(r.date);
              if (!d1 || !d2) return false;
              const days = daysBetween(d1, d2);
              return days >= 330 && days <= 400;
            });
            let yh = "—", yw = "—";
            if (yearAgo) {
              if (r.height && yearAgo.height) yh = (r.height - yearAgo.height > 0 ? '+' : '') + (r.height - yearAgo.height).toFixed(1);
              if (r.weight && yearAgo.weight) yw = (r.weight - yearAgo.weight > 0 ? '+' : '') + (r.weight - yearAgo.weight).toFixed(1);
            }
            const bmi = r.bmi != null ? r.bmi.toFixed(1) : (r.height && r.weight ? (r.weight / ((r.height/100)**2)).toFixed(1) : "—");

              <td><code class="kbd">${esc(r.date)}</code></td>
              <td><strong>${r.height != null ? r.height.toFixed(1) : "—"}</strong></td>

              <td>${r.weight != null ? r.weight.toFixed(2) : "—"}</td>
              <td style="font-size:12px;color:var(--ink-muted)">${trendW}</td>
              <td>${bmi}</td>
              <td style="font-size:11px;color:var(--ink-muted)">${yh}/${yw}</td>
              <td style="font-size:12px;color:var(--ink-soft)">${esc(r.note || '')}</td>
              <td><div class="row-actions">
                <button class="icon-btn" onclick="editMeasurement(${i})">✎</button>
                <button class="icon-btn" onclick="deleteRow('measurements', ${i}, 'měření')">✕</button>
              </div></td>
            </tr>`;
          }).join("")}

  `;
}

function whoPercentile(metric, ageMonths, value) {
  const table = WHO_BOYS[metric];
  if (!table) return "—";
  // Find closest age bracket
  const ages = Object.keys(table).map(Number).sort((a,b) => a-b);
  let lo = ages[0], hi = ages[ages.length-1];
  for (let i = 0; i < ages.length-1; i++) {
    if (ageMonths >= ages[i] && ageMonths <= ages[i+1]) { lo = ages[i]; hi = ages[i+1]; break; }
  }
  // Interpolate percentiles for this age
  const t = hi === lo ? 0 : (ageMonths - lo) / (hi - lo);
  const lowP = table[lo], hiP = table[hi];
  const p = lowP.map((v, i) => v + (hiP[i] - v) * t);
  // p = [P3, P15, P50, P85, P97]
  const labels = ["<3", "3-15", "15-50", "50-85", "85-97", ">97"];
  if (value < p[0]) return labels[0] + ".p";
  if (value < p[1]) return labels[1] + ".p";
  if (value < p[2]) return labels[2] + ".p";
  if (value < p[3]) return labels[3] + ".p";
  if (value < p[4]) return labels[4] + ".p";
  return labels[5] + ".p";
}

function renderGrowthTrendChart(ms, metric) {
  // Filter to entries with the metric set
  const data = ms.filter(m => {
    if (metric === "height") return m.height != null;
    if (metric === "weight") return m.weight != null;
    if (metric === "bmi") return m.bmi != null || (m.height != null && m.weight != null);
    return false;
  }).map(m => {
    let v = null;
    if (metric === "height") v = m.height;
    else if (metric === "weight") v = m.weight;
    else if (metric === "bmi") v = m.bmi != null ? m.bmi : m.weight / ((m.height/100)**2);
    return { date: m.date, value: v };
  });
  
  if (data.length < 2) return '<div class="empty" style="padding:30px">Potřeba alespoň 2 měření pro graf.</div>';
  
  const W = 800, H = 320, padL = 50, padR = 30, padT = 30, padB = 50;
  
  const values = data.map(d => d.value);
  const minV = Math.min(...values) - (metric === "height" ? 2 : 0.5);
  const maxV = Math.max(...values) + (metric === "height" ? 2 : 0.5);
  
  const dates = data.map(d => parseDateIso(d.date).getTime());
  const minD = Math.min(...dates), maxD = Math.max(...dates);
  
  function px(t) { return padL + (t - minD) / Math.max(maxD - minD, 1) * (W - padL - padR); }
  function py(v) { return H - padB - (v - minV) / (maxV - minV) * (H - padT - padB); }
  
  // Compute 12-month moving average of monthly increments
  // First: monthly increments
  const increments = [];
  for (let i = 1; i < data.length; i++) {
    const t1 = parseDateIso(data[i-1].date).getTime();
    const t2 = parseDateIso(data[i].date).getTime();
    const months = (t2 - t1) / (1000*60*60*24*30.44);
    if (months > 0) {
      increments.push({ date: data[i].date, t: t2, monthly: (data[i].value - data[i-1].value) / months });
    }
  }
  // 12-month rolling avg
  const rolling = increments.map((cur, idx) => {
    const last12 = increments.slice(Math.max(0, idx - 11), idx + 1);
    const avg = last12.reduce((s, x) => s + x.monthly, 0) / last12.length;
    return { t: cur.t, avg };
  });
  // Project rolling avg onto value scale - using last value as anchor
  // Actually for trend chart we display the value path + a secondary axis for rolling avg
  // Simpler: show rolling avg as small numerical badge per year
  
  const path = data.map((d, i) => {
    const x = px(parseDateIso(d.date).getTime());
    const y = py(d.value);
    return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ');
  
  // Detect stagnation: 3+ months with <0.3 cm/month change (for height)
  let stagnationMarkers = '';
  if (metric === "height") {
    for (let i = 2; i < data.length; i++) {
      const slice = data.slice(i-2, i+1);
      const dT = (parseDateIso(slice[2].date).getTime() - parseDateIso(slice[0].date).getTime()) / (1000*60*60*24*30.44);
      const dV = slice[2].value - slice[0].value;
      if (dT >= 2 && dT <= 5 && dV < dT * 0.3) {
        // Mark stagnation period
        const x1 = px(parseDateIso(slice[0].date).getTime());
        const x2 = px(parseDateIso(slice[2].date).getTime());
        stagnationMarkers += `<rect x="${x1}" y="${padT}" width="${x2-x1}" height="${H-padT-padB}" fill="#f0e4c4" opacity="0.3"/>`;
      }
    }
  }
  
  const unit = metric === "height" ? "cm" : metric === "weight" ? "kg" : "";
  const yTicks = 5;
  
  return `
    <div style="display:flex;gap:20px;margin-bottom:12px;font-size:12px">
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--accent);vertical-align:middle"></span> ${metric === "height" ? "Výška (cm)" : metric === "weight" ? "Váha (kg)" : "BMI"}</span>
      ${metric === "height" ? '<span><span style="display:inline-block;width:14px;height:10px;background:#f0e4c4;opacity:0.6;vertical-align:middle"></span> Stagnace (&lt;0,3 cm/měs)</span>' : ''}
      <span style="margin-left:auto;color:var(--ink-muted)">Najetí myší = detail</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:360px">
      ${stagnationMarkers}
      <!-- Y axis grid -->
      ${Array.from({length: yTicks+1}, (_, i) => {
        const v = minV + (maxV - minV) * i / yTicks;
        const y = py(v);
        return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${padL-8}" y="${y+3}" font-size="10" text-anchor="end" fill="var(--ink-muted)" font-family="JetBrains Mono">${v.toFixed(1)}</text>`;
      }).join('')}
      <text x="${padL-30}" y="${(H-padT-padB)/2 + padT}" font-size="10" fill="var(--ink-muted)" transform="rotate(-90 ${padL-30} ${(H-padT-padB)/2 + padT})">${unit}</text>
      <!-- X axis: year labels -->
      ${(() => {
        const years = [...new Set(data.map(d => d.date.slice(0,4)))];
        return years.map(y => {
          const yearMid = data.find(d => d.date.startsWith(y));
          if (!yearMid) return '';
          const x = px(parseDateIso(yearMid.date).getTime());
          return `<text x="${x}" y="${H-padB+18}" font-size="10" text-anchor="start" fill="var(--ink-muted)" font-family="JetBrains Mono">${y}</text>`;
        }).join('');
      })()}
      <!-- Data line -->
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <!-- Dots with tooltips -->
      ${data.map(d => {
        const x = px(parseDateIso(d.date).getTime());
        const y = py(d.value);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"><title>${esc(d.date)}: ${d.value.toFixed(metric === "height" ? 1 : 2)} ${unit}</title></circle>`;
      }).join('')}
    </svg>
    ${rolling.length ? `
      <div style="margin-top:12px;padding:10px;background:var(--bg-card);border-radius:6px;font-size:12px">
        <strong>12-měsíční klouzavý průměr přírůstku</strong> (poslední): ${rolling[rolling.length-1].avg.toFixed(2)} ${unit}/měs
        ${metric === "height" ? ` · norma 0,4–0,6 cm/měs (5–7 cm/rok)` : ""}
      </div>
    ` : ''}
  `;
}

function renderWHOPercentileChart(ms, metric) {
  const data = ms.filter(m => {
    if (metric === "height") return m.height != null;
    if (metric === "weight") return m.weight != null;
    if (metric === "bmi") return m.bmi != null || (m.height != null && m.weight != null);
    return false;
  }).map(m => {
    let v = null;
    if (metric === "height") v = m.height;
    else if (metric === "weight") v = m.weight;
    else if (metric === "bmi") v = m.bmi != null ? m.bmi : m.weight / ((m.height/100)**2);
    return { date: m.date, ageMonths: ageInMonths(m.date), value: v };
  }).filter(d => d.ageMonths != null);

  if (data.length === 0) return '<div class="empty" style="padding:30px">Pro WHO percentily doplň datum narození: Info → Profil → ✎ Upravit → Datum narození.</div>';
  
  const W = 800, H = 380, padL = 50, padR = 80, padT = 30, padB = 50;
  
  const ages = data.map(d => d.ageMonths);
  const minAge = Math.min(0, ...ages) - 6;
  const maxAge = Math.max(120, ...ages) + 6;
  
  const table = WHO_BOYS[metric];
  // Get WHO bounds
  const whoAges = Object.keys(table).map(Number).sort((a,b) => a-b);
  const whoVals = whoAges.flatMap(a => table[a]);
  const values = data.map(d => d.value);
  const minV = Math.min(...whoVals, ...values) - (metric === "height" ? 5 : 1);
  const maxV = Math.max(...whoVals, ...values) + (metric === "height" ? 5 : 1);
  
  function px(age) { return padL + (age - minAge) / (maxAge - minAge) * (W - padL - padR); }
  function py(v) { return H - padB - (v - minV) / (maxV - minV) * (H - padT - padB); }
  
  // Draw 5 WHO percentile curves
  const percentileColors = ["#a8412a", "#d4a574", "var(--accent)", "#d4a574", "#a8412a"];
  const percentileLabels = ["P3", "P15", "P50", "P85", "P97"];
  
  let percentilePaths = '';
  for (let pi = 0; pi < 5; pi++) {
    const points = whoAges.map(a => `${px(a).toFixed(1)},${py(table[a][pi]).toFixed(1)}`).join(' ');
    const opacity = pi === 2 ? 1 : 0.4;
    const width = pi === 2 ? 2 : 1;
    const dash = pi === 0 || pi === 4 ? '4,3' : pi === 1 || pi === 3 ? '2,2' : '';
    percentilePaths += `<polyline points="${points}" fill="none" stroke="${percentileColors[pi]}" stroke-width="${width}" stroke-dasharray="${dash}" opacity="${opacity}"/>`;
    // Label at right end
    const lastA = whoAges[whoAges.length-1];
    const lastV = table[lastA][pi];
    percentilePaths += `<text x="${px(lastA)+4}" y="${py(lastV)+3}" font-size="9" fill="${percentileColors[pi]}" font-family="JetBrains Mono">${percentileLabels[pi]}</text>`;
  }
  
  // Patient data points
  const patientDots = data.map((d, i) => {
    const x = px(d.ageMonths), y = py(d.value);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#2c4f6b"><title>${esc(d.date)} (${(d.ageMonths/12).toFixed(1)} let): ${d.value.toFixed(metric === "height" ? 1 : 2)}</title></circle>`;
  }).join('');
  
  // Patient connecting line
  const sortedByAge = [...data].sort((a,b) => a.ageMonths - b.ageMonths);
  const patientPath = sortedByAge.map((d, i) => `${i === 0 ? 'M' : 'L'} ${px(d.ageMonths).toFixed(1)} ${py(d.value).toFixed(1)}`).join(' ');
  
  const unit = metric === "height" ? "cm" : metric === "weight" ? "kg" : "";
  
  return `
    <div style="display:flex;gap:14px;margin-bottom:12px;font-size:11.5px;flex-wrap:wrap">
      <span><span style="display:inline-block;width:14px;height:2px;background:#a8412a;vertical-align:middle"></span> P3, P97 (extrémy)</span>
      <span><span style="display:inline-block;width:14px;height:2px;background:#d4a574;vertical-align:middle"></span> P15, P85</span>
      <span><span style="display:inline-block;width:14px;height:2px;background:var(--accent);vertical-align:middle"></span> P50 (medián)</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:#2c4f6b;border-radius:50%;vertical-align:middle"></span> <strong>Martin</strong></span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:420px">
      <!-- Grid -->
      ${[0, 24, 48, 72, 96, 120].map(a => {
        if (a < minAge || a > maxAge) return '';
        return `<line x1="${px(a)}" y1="${padT}" x2="${px(a)}" y2="${H-padB}" stroke="var(--line)" stroke-width="0.5"/>
                <text x="${px(a)}" y="${H-padB+18}" font-size="10" text-anchor="middle" fill="var(--ink-muted)" font-family="JetBrains Mono">${(a/12).toFixed(0)}r</text>`;
      }).join('')}
      ${[minV, minV + (maxV-minV)*0.25, minV + (maxV-minV)*0.5, minV + (maxV-minV)*0.75, maxV].map(v => 
        `<line x1="${padL}" y1="${py(v)}" x2="${W-padR}" y2="${py(v)}" stroke="var(--line)" stroke-width="0.5"/>
         <text x="${padL-8}" y="${py(v)+3}" font-size="10" text-anchor="end" fill="var(--ink-muted)" font-family="JetBrains Mono">${v.toFixed(0)}</text>`
      ).join('')}
      <text x="${padL-30}" y="${(H-padT-padB)/2+padT}" font-size="10" fill="var(--ink-muted)" transform="rotate(-90 ${padL-30} ${(H-padT-padB)/2+padT})">${unit}</text>
      <text x="${(W)/2}" y="${H-12}" font-size="10" text-anchor="middle" fill="var(--ink-muted)">Věk (roky)</text>
      <!-- WHO curves -->
      ${percentilePaths}
      <!-- Patient -->
      ${patientPath ? `<path d="${patientPath}" fill="none" stroke="#2c4f6b" stroke-width="1.5" stroke-dasharray="3,2"/>` : ''}
      ${patientDots}
    </svg>
  `;
}

function globalSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) { renderAll(); return; }

  const results = [];

  // Tasks
  DB.tasks.forEach((t, i) => {
    const text = `${t.title || ''} ${t.category || t.domain || ''} ${t.contact || t.reason || ''} ${t.deadline || ''}`.toLowerCase();
    if (text.includes(q)) results.push({ page: "tasks", label: "Úkol", title: t.title, snippet: (t.contact || t.reason || '') + (t.deadline ? ' · ' + t.deadline : '') });
  });
  // Examinations
  DB.examinations.forEach(e => {
    if ((e.type + " " + e.conclusion + " " + e.domain).toLowerCase().includes(q))
      results.push({ page: "examinations", label: "Vyšetření", title: `${e.date} · ${e.type}`, snippet: e.conclusion });
  });
  // Contacts
  DB.contacts.forEach(c => {
    if ((c.name + " " + c.specialty + " " + c.role).toLowerCase().includes(q))
      results.push({ page: "contacts", label: "Kontakt", title: c.name, snippet: c.role + " · " + c.phone });
  });
  // Questions
  DB.questions.forEach(qq => {
    if (qq.q.toLowerCase().includes(q))
      results.push({ page: "questions", label: "Otázka pro " + qq.doctor, title: qq.q, snippet: "" });
  });
  // Diagnoses
  DB.diagnoses.forEach(d => {
    if ((d.code + " " + d.name + " " + d.note).toLowerCase().includes(q))
      results.push({ page: "diagnoses", label: "Diagnóza", title: `${d.code} · ${d.name}`, snippet: d.note });
  });
  // Topics
  DB.topics.forEach(t => {
    const text = `${t.title} ${t.know} ${(t.doing || []).join(" ")} ${(t.todo || []).join(" ")}`.toLowerCase();
    if (text.includes(q)) results.push({ page: "topics", label: "Tematická oblast", title: t.title, snippet: t.know.slice(0, 120) + "…" });
  });
  // Genetic findings
  DB.genetics.findings.forEach(f => {
    if ((f.gene + " " + f.disease + " " + f.note).toLowerCase().includes(q))
      results.push({ page: "genetics", label: "Genetický nález", title: `${f.gene} · ${f.disease}`, snippet: f.note });
  });
  // Appointments (kalendář)
  (DB.appointments || []).forEach(a => {
    const text = `${a.ambulance || ''} ${a.lekar || ''} ${a.kde || ''} ${a.komentar || ''} ${a.frekvence || ''}`.toLowerCase();
    if (text.includes(q)) results.push({ page: "appointments", label: "Kontrola", title: `${a.ambulance} · ${a.lekar || ''}`, snippet: `${a.budouciDate || a.budouciText || ''} · ${a.komentar || ''}` });
  });
  // Exercise log
  (DB.exerciseLog || []).forEach(e => {
    if (`${e.date} ${e.poznamka || ''}`.toLowerCase().includes(q))
      results.push({ page: "exercise", label: "Cvičení", title: e.date, snippet: e.poznamka || `Cvičil: ${e.cvicil}` });
  });

  const highlight = txt => esc(txt).replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "<mark>$1</mark>");

  const _gsAct = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("search");
  const _gsPos = _gsAct && document.activeElement.selectionStart != null ? document.activeElement.selectionStart : null;
  $("#main").innerHTML = `
    <div class="page-header">
      <div>
        <div class="page-title">Hledat: "${esc(query)}"</div>
        <div class="page-subtitle">${results.length} výsledků · <span class="search-wrap" style="display:inline-block"><input type="text" class="search" id="globalSearchBox" value="${esc(query)}" oninput="globalSearch(this.value)" placeholder="Hledat…" style="padding:6px 10px"></span></div>
      </div>
      <div class="page-actions">
        <button class="btn" onclick="renderAll()">✕ Zavřít</button>
      </div>
    </div>
    ${results.length ? `<div class="list-wrap">
      ${results.map(r => `
        <div class="item-row" onclick="goto('${r.page}')" style="cursor:pointer">
          <div class="item-body">
            <div class="item-meta" style="margin-bottom:4px"><span class="tag blue">${esc(r.label)}</span></div>
            <div class="item-title">${highlight(r.title)}</div>
            ${r.snippet ? `<div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px">${highlight(r.snippet)}</div>` : ""}
          </div>
        </div>
      `).join("")}
    </div>` : `<div class="empty">Nic nenalezeno</div>`}
  `;
  const _gsEl = document.getElementById("globalSearchBox");
  if (_gsEl && _gsAct) { _gsEl.focus(); try { if (_gsPos != null) _gsEl.setSelectionRange(_gsPos, _gsPos); } catch (e) {} }
}

// MOTIV (světlo / systém / tma)
// ============================================================
function _themePref() { try { return localStorage.getItem("themePref") || "system"; } catch (e) { return "system"; } }
function _prefersDark() { try { return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; } }
function applyTheme() {
  if (typeof document === "undefined" || !document.documentElement) return; // test/headless
  const pref = _themePref();
  const dark = pref === "dark" || (pref === "system" && _prefersDark());
  const h = document.documentElement;
  h.setAttribute("data-theme-pref", pref);
  h.setAttribute("data-theme", dark ? "dark" : "light");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#16130f" : "#eef0f4");
  document.querySelectorAll(".theme-toggle button").forEach(b => {
    const on = b.getAttribute("data-theme") === pref;
    b.classList.toggle("is-on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}
function setTheme(pref) {
  try { localStorage.setItem("themePref", pref); } catch (e) {}
  applyTheme();
}
let _themeMqlBound = false;
function bindThemeMql() {
  if (_themeMqlBound) return;
  try {
    const mql = matchMedia("(prefers-color-scheme: dark)");
    const cb = () => { if (_themePref() === "system") applyTheme(); };
    if (mql.addEventListener) mql.addEventListener("change", cb);
    else if (mql.addListener) mql.addListener(cb);
    _themeMqlBound = true;
  } catch (e) {}
}

function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); let o = x.getDay() - 1; if (o < 0) o = 6; x.setDate(x.getDate() - o); return x; }
let hubCalMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();

const ASSIGNEES = ["", "Bára", "Michal", "Oba"];
const WEEKDAYS_CZ = ["Ne", "Po", "Út", "St", "Čt", "Pá", "So"]; // index = JS getDay()
function assigneeBadge(a) {
  if (!a) return "";
  const col = a === "Bára" ? "var(--teal)" : a === "Michal" ? "var(--purple)" : "var(--accent)";
  return `<span class="tag" style="background:${col};color:#fff">${esc(a)}</span>`;
}
function repeatLabel(r) {
  if (!r) return "";
  if (r.freq === "daily") return "denně";
  if (r.freq === "weekly") return "týdně · " + (WEEKDAYS_CZ[r.weekday ?? 1] || "Po");
  if (r.freq === "monthly") return "měsíčně · " + (r.day || 1) + ".";
  if (r.freq === "yearly") return "ročně · " + (r.day || 1) + ". " + ((r.month ?? 0) + 1) + ".";
  return "";
}
function parseWeekdayCz(s) {
  const i = WEEKDAYS_CZ.findIndex(w => w.toLowerCase() === String(s || "").trim().toLowerCase());
  return i >= 0 ? i : 1; // default pondělí
}
function buildRepeat(freqLabel, whenStr) {
  if (freqLabel === "Denně") return { freq: "daily" };
  if (freqLabel === "Týdně") return { freq: "weekly", weekday: parseWeekdayCz(whenStr) };
  if (freqLabel === "Měsíčně") return { freq: "monthly", day: Math.min(Math.max(parseInt(whenStr) || 1, 1), 31) };
  return null;
}
function isoOf(y, m, d) { return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function taskOccurrencesInMonth(t, year, month) {
  const r = t.repeat; if (!r) return [];
  const last = new Date(year, month + 1, 0).getDate();
  const out = [];
  if (r.freq === "daily") { for (let d = 1; d <= last; d++) out.push(isoOf(year, month, d)); }
  else if (r.freq === "weekly") { for (let d = 1; d <= last; d++) { if (new Date(year, month, d).getDay() === (r.weekday ?? 1)) out.push(isoOf(year, month, d)); } }
  else if (r.freq === "monthly") { out.push(isoOf(year, month, Math.min(r.day || 1, last))); }
  else if (r.freq === "yearly") { if (month === (r.month ?? 0)) out.push(isoOf(year, month, Math.min(r.day || 1, last))); }
  return out;
}

function hubEvents() {
  const evs = [];
  (DB.appointments || []).forEach(a => {
    if (parseDateIso(a.budouciDate)) evs.push({ iso: a.budouciDate, label: (a.ambulance || "") + (a.lekar ? " · " + a.lekar : ""), cat: "Kontrola", module: "care", page: "appointments", assignee: "" });
    if (parseDateIso(a.terminVolaniDate)) evs.push({ iso: a.terminVolaniDate, label: "Volat: " + (a.ambulance || ""), cat: "Volání", module: "care", page: "appointments", assignee: "" });
  });
  (DB.tasks || []).forEach(t => {
    if (!t.done && !t.repeat && parseDateIso(t.dueDate)) evs.push({ iso: t.dueDate, label: t.title || "", cat: "Úkol", module: "care", page: "tasks", assignee: t.assignee || "" });
  });
  (DB.adminTasks || []).forEach(t => {
    if (!t.done && !t.repeat && parseDateIso(t.dueDate)) evs.push({ iso: t.dueDate, label: t.title || "", cat: "Úkol", module: "tasks", page: "tasks", assignee: t.assignee || "" });
  });
  (DB.maintenance || []).forEach(m => {
    if (parseDateIso(m.dueDate)) evs.push({ iso: m.dueDate, label: "🔧 " + (m.name || "") + (m.contact ? " · " + m.contact : ""), cat: "Revize", module: "maint", page: "", assignee: "" });
  });
  return evs;
}

// Události pro daný měsíc včetně rozbalených opakovaných úkolů
function hubEventsExpanded(year, month) {
  const evs = hubEvents().filter(e => { const d = parseDateIso(e.iso); return d && d.getFullYear() === year && d.getMonth() === month; });
  (DB.tasks || []).forEach(t => {
    if (t.done || !t.repeat) return;
    taskOccurrencesInMonth(t, year, month).forEach(iso => evs.push({ iso, label: t.title || "", cat: "Úkol", module: "care", page: "tasks", assignee: t.assignee || "", repeat: true }));
  });
  (DB.adminTasks || []).forEach(t => {
    if (t.done || !t.repeat) return;
    taskOccurrencesInMonth(t, year, month).forEach(iso => evs.push({ iso, label: t.title || "", cat: "Úkol", module: "tasks", page: "tasks", assignee: t.assignee || "", repeat: true }));
  });
  return evs;
}

function hubFilterAssignee(evs) {
  if (hubCalAssignee === "all") return evs;
  return evs.filter(e => e.cat !== "Úkol" || e.assignee === hubCalAssignee || e.assignee === "Oba");
}

// Opakuje se úkol v daný den?
function occursOn(t, d) {
  const r = t.repeat; if (!r) return false;
  if (r.freq === "daily") return true;
  if (r.freq === "weekly") return d.getDay() === (r.weekday ?? 1);
  if (r.freq === "monthly") return d.getDate() === (r.day || 1);
  if (r.freq === "yearly") return d.getMonth() === (r.month ?? 0) && d.getDate() === (r.day || 1);
  return false;
}
// Události pro konkrétní den (ISO) vč. rozbalených opakování
function hubEventsForDay(iso) {
  const evs = hubEvents().filter(e => e.iso === iso);
  const d = parseDateIso(iso); if (!d) return hubFilterAssignee(evs);
  (DB.tasks || []).forEach(t => { if (!t.done && t.repeat && occursOn(t, d)) evs.push({ iso, label: t.title || "", cat: "Úkol", module: "care", page: "tasks", assignee: t.assignee || "", repeat: true }); });
  (DB.adminTasks || []).forEach(t => { if (!t.done && t.repeat && occursOn(t, d)) evs.push({ iso, label: t.title || "", cat: "Úkol", module: "tasks", page: "tasks", assignee: t.assignee || "", repeat: true }); });
  return hubFilterAssignee(evs);
}

function hubCalShift(delta) { const x = new Date(hubCalWeek); x.setDate(x.getDate() + delta * 7); hubCalWeek = x; hubDayDetail = null; refreshHubCalendar(); }
function hubCalToday() { hubCalWeek = mondayOf(new Date()); hubDayDetail = null; refreshHubCalendar(); }
function hubShowDay(iso) { hubDayDetail = (hubDayDetail === iso) ? null : iso; refreshHubCalendar(); }
function hubOpenEvent(module, page) { enterModule(module); if (module === "care" && page) goto(page); }

function renderHubCalendar() {
  if (!DB) return "";
  const monthNames = ["ledna", "února", "března", "dubna", "května", "června", "července", "srpna", "září", "října", "listopadu", "prosince"];
  const dayNames = ["Pondělí", "Úterý", "Středa", "Čtvrtek", "Pátek", "Sobota", "Neděle"];
  const start = new Date(hubCalWeek);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayIso = isoLocal(today);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  // 7 denních bloků s výpisem událostí
  let daysHtml = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const di = iso(d);
    const ev = hubEventsForDay(di);
    const isToday = di === todayIso;
    const isPast = di < todayIso;
    daysHtml += `
      <div class="wk-day ${isToday ? "today" : ""} ${isPast ? "past" : ""}">
        <div class="wk-day-head">
          <span class="wk-day-name">${dayNames[i]}</span>
          <span class="wk-day-date">${d.getDate()}. ${monthNames[d.getMonth()]}${isToday ? " · dnes" : ""}</span>
        </div>
        ${ev.length ? ev.map(e => `
          <div class="wk-ev" onclick="hubOpenEvent('${e.module}','${e.page}')">
            <span class="wk-dot" style="background:${HUB_EVENT_CATS[e.cat] || "var(--ink-muted)"}"></span>
            <span class="wk-ev-txt">${esc(e.label)}${e.repeat ? ' <span style="color:var(--ink-muted);font-size:11px">↻</span>' : ""}</span>
            ${e.assignee ? assigneeBadge(e.assignee) : ""}
          </div>`).join("") : `<div class="wk-empty">—</div>`}
      </div>`;
  }

  const rangeLabel = `${start.getDate()}. ${monthNames[start.getMonth()]} – ${end.getDate()}. ${monthNames[end.getMonth()]} ${end.getFullYear()}`;
  const legend = Object.keys(HUB_EVENT_CATS).map(c => `<span><span class="cal-dot" style="display:inline-block;background:${HUB_EVENT_CATS[c]}"></span> ${c}</span>`).join("");
  const notifyBtn = (notifyState() === "granted") ? "" :
    `<button class="btn" style="font-size:11px;padding:5px 10px" onclick="enableNotifications()">🔔 Zapnout připomínky</button>`;

  return `
    <div class="cal-wrap card elev">
      <div class="cal-header">
        <button class="cal-nav" onclick="hubCalShift(-1)">‹</button>
        <div class="cal-title">📅 Týden ${rangeLabel} — co nás čeká</div>
        <button class="btn" style="font-size:11px;padding:5px 10px" onclick="hubCalToday()">Tento týden</button>
        <button class="cal-nav" onclick="hubCalShift(1)">›</button>
      </div>
      <div class="wk-grid">${daysHtml}</div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:14px;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--ink-muted);margin-right:2px">Řešitel:</span>
        ${["all", "Bára", "Michal"].map(a => `<button class="filter-btn ${hubCalAssignee === a ? "active" : ""}" onclick="hubCalAssignee='${a}'; refreshHubCalendar()">${a === "all" ? "Vše" : a}</button>`).join("")}
        ${notifyBtn ? `<span style="margin-left:auto">${notifyBtn}</span>` : ""}
      </div>
      <div style="display:flex;gap:18px;margin-top:12px;font-size:11px;color:var(--ink-muted);flex-wrap:wrap">
        ${legend}
        <span style="margin-left:auto">Klik na položku = otevřít v modulu</span>
      </div>
    </div>`;
}

function maintFields(m) {

    { key: "name", label: "Co (vyber nebo napiš vlastní)", type: "datalist", options: MAINT_SUGGEST, value: m.name || "" },

    { key: "dueDate", label: "Termín (kdy má proběhnout / přijet servisák)", type: "date", value: m.dueDate || "" },
    { key: "freqMonths", label: "Opakovat po … měsících (volitelné, např. 12)", value: m.freqMonths ? String(m.freqMonths) : "" },
    { key: "contact", label: "Servisák / firma (volitelné)", value: m.contact || "" },
    { key: "phone", label: "Telefon (volitelné)", value: m.phone || "" },
    { key: "note", label: "Poznámka (co se dělá, ceny…)", type: "textarea", value: m.note || "" }
  ];
}
function applyMaint(m, d) {
  return { ...m, name: d.name || "(bez názvu)", kind: d.kind || MAINT_KINDS[0], dueDate: d.dueDate || "", freqMonths: parseInt(d.freqMonths, 10) || 0, contact: d.contact || "", phone: d.phone || "", note: d.note || "" };
}
function addMaint() { openModal("Nová revize / údržba", maintFields({}), d => maintList().push(applyMaint({ lastDone: "" }, d))); }
function editMaint(i) { const m = maintList()[i]; openModal("Upravit", maintFields(m), d => { DB.maintenance[i] = applyMaint(m, d); }); }
function markMaintDone(i) {
  const m = maintList()[i];
  if (!m) return;
  m.lastDone = isoLocal();
  if (m.freqMonths > 0) {
    const base = new Date();
    base.setMonth(base.getMonth() + m.freqMonths);
    m.dueDate = isoLocal(base);
    save(); renderAll();
  } else {
    if (confirm("Provedeno ✓. Položka nemá nastavené opakování — nechat ji v seznamu bez termínu (OK), nebo ji smazat (Zrušit → ✕)?")) { m.dueDate = ""; }
    save(); renderAll();
  }
}

function fmtCZK(n) { n = Math.round(+n || 0); const s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); return (n < 0 ? "-" : "") + s + " Kč"; }
function fmtNum(n, dec) { if (n == null || n === "") return "–"; const x = (+n).toFixed(dec == null ? 1 : dec); return x.replace(".", ",").replace(/\B(?=(\d{3})+(?!\d)\,)/g, " "); }
function niceNum(x) { if (x <= 0) return 1; const e = Math.floor(Math.log10(x)); const f = x / Math.pow(10, e); let nf; if (f < 1.5) nf = 1; else if (f < 3) nf = 2; else if (f < 7) nf = 5; else nf = 10; return nf * Math.pow(10, e); }
function niceTicks(min, max, count) { if (max === min) max = min + 1; const step = niceNum((max - min) / count); const start = Math.floor(min / step) * step; const end = Math.ceil(max / step) * step; const t = []; for (let v = start; v <= end + 1e-9; v += step) t.push(Math.round(v * 1000) / 1000); return t; }
var CAT_PALETTE = [
  { c: "var(--green)", bg: "var(--green-bg)" }, { c: "var(--blue)", bg: "var(--blue-bg)" },
  { c: "var(--purple)", bg: "var(--purple-bg)" }, { c: "var(--teal)", bg: "var(--teal-bg)" },
  { c: "var(--yellow)", bg: "var(--yellow-bg)" }, { c: "var(--red)", bg: "var(--red-bg)" },
  { c: "var(--accent)", bg: "#ece1d0" }
];
function catHash(s) { s = String(s || ""); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function catColor(s) { return CAT_PALETTE[catHash(s) % CAT_PALETTE.length]; }

const DIARY_TAGS = ["Zdraví", "Škola", "Milník", "Chování", "Jiné"];
let diaryTagSel = "";     // vybraný tag v composeru
let diaryFilter = "";     // fulltext filtr
let diaryTagFilter = "all";

function diaryList() { if (!Array.isArray(DB.diary)) DB.diary = []; return DB.diary; }

function renderDiary() {
  const all = diaryList().slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
  const q = _normTxt(diaryFilter).trim();
  const list = all.filter(e =>
    (diaryTagFilter === "all" || (e.tag || "Jiné") === diaryTagFilter) &&
    (!q || _normTxt(e.text + " " + (e.tag || "")).indexOf(q) !== -1));
  const tagsUsed = [...new Set(all.map(e => e.tag || "Jiné"))];

  // skupiny po dnech
  const byDay = {};
  list.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  const days = Object.keys(byDay).sort((a, b) => b.localeCompare(a));

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Deník</div>
        <div class="page-subtitle">${all.length} zápisů · drobnosti i milníky</div>
      </div>
    </div>

    <div class="card elev diary-composer">
      <textarea id="diaryText" rows="2" placeholder="Co se dnes stalo? (vypadl zub, byl hodný, dostal pusu…)"></textarea>
      <div class="diary-controls">
        <input type="date" id="diaryDate" value="${esc(isoLocal())}" max="${esc(isoLocal())}">
        <div class="chipline" id="diaryChips">
          ${DIARY_TAGS.map((t, i) => `<button type="button" class="chip ${diaryTagSel === t ? "on" : ""}" onclick="diaryToggleTag(${i})">${t}</button>`).join("")}
        </div>
        <button class="btn primary" onclick="addDiaryEntry()">Uložit zápis</button>
      </div>
    </div>

    <div class="filters" style="margin-top:18px">
      <input type="search" id="diarySearch" placeholder="Hledat v deníku…" value="${esc(diaryFilter)}" oninput="diaryFilter=this.value; renderAll()" style="flex:1;min-width:150px;padding:8px 12px">
      <button class="filter-btn ${diaryTagFilter === "all" ? "active" : ""}" onclick="diaryTagFilter='all'; renderAll()">Vše</button>
      ${tagsUsed.map((t, i) => `<button class="filter-btn ${diaryTagFilter === t ? "active" : ""}" onclick="diarySetTagFilter(${i})">${esc(t)}</button>`).join("")}
    </div>

    ${days.length ? days.map(d => {
      const dd = parseDateIso(d);
      const lab = dd ? dd.toLocaleDateString("cs-CZ", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : (d || "bez data");
      return `<div class="section" style="margin-top:14px">
        <div class="diary-day">${esc(lab)}</div>
        ${byDay[d].map(e => {
          const i = diaryList().indexOf(e);
          return `<div class="card diary-entry">
            ${e.tag ? `<span class="tag ${diaryTagClass(e.tag)}">${esc(e.tag)}</span>` : ""}
            <div class="diary-text">${esc(e.text)}</div>
            <div class="row-actions">
              <button class="icon-btn" onclick="editDiaryEntry(${i})">✎</button>
              <button class="icon-btn" onclick="deleteRow('diary', ${i}, 'zápis')">✕</button>
            </div>
          </div>`;
        }).join("")}
      </div>`;
    }).join("") : `<div class="empty" style="padding:24px">${all.length ? "Nic nenalezeno." : "Zatím žádné zápisy — napiš první nahoře. Stačí věta."}</div>`}
  `;
}

function diaryTagClass(t) {
  return t === "Zdraví" ? "blue" : t === "Škola" ? "yellow" : t === "Milník" ? "green" : t === "Chování" ? "purple" : "neutral";
}

// Přepnutí tématu bez překreslení stránky — rozepsaný text zůstane zachován
function diarySetTagFilter(i) {
  const all = diaryList();
  const tagsUsed = [...new Set(all.map(e => e.tag || "Jiné"))];
  diaryTagFilter = tagsUsed[i] != null ? tagsUsed[i] : "all";
  renderAll();
}

function diaryToggleTag(i) {
  const t = DIARY_TAGS[i];
  diaryTagSel = (diaryTagSel === t) ? "" : t;
  document.querySelectorAll("#diaryChips .chip").forEach((el, j) => el.classList.toggle("on", DIARY_TAGS[j] === diaryTagSel));
}

function addDiaryEntry() {
  const txt = (document.getElementById("diaryText") || {}).value || "";
  const date = (document.getElementById("diaryDate") || {}).value || isoLocal();
  if (!txt.trim()) { alert("Napiš nejdřív text zápisu."); return; }
  diaryList().push({ id: uid(), date, text: txt.trim(), tag: diaryTagSel || "", createdAt: Date.now() });
  diaryTagSel = "";
  save(); renderAll();
}

function editDiaryEntry(i) {
  const e = diaryList()[i];

  info:         "var(--accent)",

  genetics:     "var(--purple)",
  examinations: "var(--blue)",

function renderAll() {
  if (!DB) return; // ještě nejsou načtená data
  if (currentModule === "tasks") { renderTasksModule(); return; }
  if (currentModule === "maint") { renderMaintModule(); return; }
  const renderer = PAGES[currentPage] || renderDashboard;
  const appEl = document.getElementById("app");
  if (appEl) appEl.style.setProperty("--sec", PAGE_ACCENT[currentPage] || "var(--accent)");
  // zachovat rozepsaný deníkový text a fokus aktivního pole přes překreslení
  const _draftEl = document.getElementById("diaryText");
  const _draft = _draftEl ? _draftEl.value : null;
  const _ae = document.activeElement;
  const _focusId = (_ae && _ae.id && _ae.closest && _ae.closest("#main")) ? _ae.id : null;
  const _selStart = _focusId && _ae.selectionStart != null ? _ae.selectionStart : null;
  $("#main").innerHTML = renderer();
  if (_draft) { const el = document.getElementById("diaryText"); if (el && !el.value) el.value = _draft; }
  if (_focusId) {
    const el = document.getElementById(_focusId);
    if (el) { el.focus(); try { if (_selStart != null && el.setSelectionRange) el.setSelectionRange(_selStart, _selStart); } catch (e) {} }
  }
  // Update counters
  const _ct = $("#cnt-tasks"); if (_ct) _ct.textContent = DB.tasks.filter(t => !t.done).length;
  const _ce = $("#cnt-exam"); if (_ce) _ce.textContent = DB.examinations.length;
  updateFab();
  updateBurgerLabel();
}

  try {
    if (FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "VLOŽ_SVŮJ_API_KEY") {
      if (!initFirebaseApp()) {
        let tries = 0;
        const t = setInterval(() => { if (initFirebaseApp() || ++tries > 50) clearInterval(t); }, 100);
      }
    }
  } catch (e) {}
});
